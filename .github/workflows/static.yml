# Deploy frontend to GitHub Pages (API runs on Render, DB on Neon)
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject production config
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            sed -i "s|__GEMINI_API_KEY__|$GEMINI_API_KEY|g" index.html
          fi
          if [ -n "$API_BASE_URL" ]; then
            sed -i "s|__API_BASE_URL__|$API_BASE_URL|g" index.html admin.html
          else
            echo "::warning::API_BASE_URL secret is not set. Auth and saved channels will not work on GitHub Pages."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
