      console.warn("Could not load cached topic classifications:", e);
    }
  }

  let unclassified = videos.filter(function (v) {
    return !isValidTopicClassification(v.topicClassification);
  });

  if (periodOnly && Object.keys(priorityIds).length) {
    unclassified = unclassified.filter(function (v) { return !!priorityIds[v.id]; });
  }

  unclassified.sort(function (a, b) {
    return (priorityIds[b.id] ? 1 : 0) - (priorityIds[a.id] ? 1 : 0);
  });

  if (!unclassified.length) {
    if (onProgress) onProgress(0, 0);
    return {
      classified: 0,
      total: 0,
      loadedFromCache: loadedFromCache,
      stoppedEarly: false,
    };
  }

  const existingTopics = {};
  videos.forEach(function (v) {
    if (isValidTopicClassification(v.topicClassification)) {
      existingTopics[v.topicClassification.primaryTopic] = true;
    }
  });
  let topicList = Object.keys(existingTopics);
  let classified = 0;
  let stoppedEarly = false;
  let stopReason = null;

  for (let i = 0; i < unclassified.length; i += GEMINI_BATCH_SIZE) {
    const batch = unclassified.slice(i, i + GEMINI_BATCH_SIZE);
    if (onProgress) {
      if (i === 0) onProgress(0, unclassified.length);
      else onProgress(classified, unclassified.length);
    }

    let results;
    let modelUsed = null;
    try {
      const geminiResponse = await callGeminiJson(buildGeminiClassificationPrompt(batch, topicList));
      results = geminiResponse.results;
      modelUsed = geminiResponse.model;
    } catch (e) {
      // Keep any progress already saved; surface a soft stop for quota/overload
      if (e && (e.status === 429 || e.status === 503) && classified > 0) {
        stoppedEarly = true;
        stopReason = e.message;
        break;
      }
      throw e;
    }

    const resultMap = {};
    results.forEach(function (row) {
      if (row && row.videoId) resultMap[row.videoId] = row;
    });

    const batchSaved = {};
    for (let j = 0; j < batch.length; j++) {
      const video = batch[j];
      const row = resultMap[video.id];
      if (!row) continue;
      const classification = normalizeTopicClassification(row);
      if (!classification) continue;
      await saveVideoTopicClassification(channelId, video.id, classification, { skipApi: true });
      video.topicClassification = classification;
      batchSaved[video.id] = classification;
      if (classification.primaryTopic !== "Other") {
        existingTopics[classification.primaryTopic] = true;
        topicList = Object.keys(existingTopics);
      }
      classified++;
    }

    if (Object.keys(batchSaved).length) {
      try {
        await saveTopicClassificationsToApi(channelId, batchSaved);
      } catch (e) {
        console.warn("Could not save topic classifications to server:", e);
      }
      logGeminiUsageToApi(channelId, modelUsed, Object.keys(batchSaved).length);
    }

    if (i + GEMINI_BATCH_SIZE < unclassified.length) {
      await sleepMs(GEMINI_BATCH_DELAY_MS);
    }
  }

  if (onProgress) onProgress(classified, unclassified.length);
  return {
    classified: classified,
    total: unclassified.length,
    loadedFromCache: loadedFromCache,
    stoppedEarly: stoppedEarly,
    stopReason: stopReason,
  };
}

function groupVideosByAiTopic(videos, totalVideos) {
  const groups = {};
  videos.forEach(function (video) {
    const c = video.topicClassification;
    const name = isValidTopicClassification(c) ? normalizePrimaryTopic(c.primaryTopic) : "Other";
    if (!groups[name]) {
      groups[name] = { id: "topic-" + topicSlug(name), name: name, videos: [] };
    }
    groups[name].videos.push(video);
  });

  let topicList = Object.values(groups);
  let other = topicList.find(function (t) { return t.name === "Other"; });
  if (!other) {
    other = { id: "topic-other", name: "Other", videos: [] };
    topicList.push(other);
  }

  topicList = topicList.filter(function (t) {
    if (t.name === "Other") return true;
    if (t.videos.length < TOPIC_MIN_VIDEOS) {
      other.videos = other.videos.concat(t.videos);
      return false;
    }
    return true;
  });

  const total = totalVideos || videos.length;
  const mainTopics = topicList.filter(function (t) { return t.name !== "Other"; });

  if (total > 0 && other.videos.length / total > TOPIC_OTHER_MAX_SHARE) {
    const movable = other.videos.slice().sort(function (a, b) {
      const ca = a.topicClassification ? a.topicClassification.confidence : 0;
      const cb = b.topicClassification ? b.topicClassification.confidence : 0;
      return ca - cb;
    });
    movable.forEach(function (video) {
      if (other.videos.length / total <= TOPIC_OTHER_MAX_SHARE) return;
      const c = video.topicClassification;
      if (!c) return;
      let target = null;
      if (c.subtopic) {
        target = mainTopics.find(function (t) {
          return t.name.toLowerCase() === c.subtopic.toLowerCase() ||
            t.name.toLowerCase().indexOf(c.subtopic.toLowerCase()) >= 0 ||
            c.subtopic.toLowerCase().indexOf(t.name.toLowerCase()) >= 0;
        }) || null;
      }
      if (!target && c.contentType) {
        let bestCount = 0;
        mainTopics.forEach(function (topic) {
          const count = topic.videos.filter(function (v) {
            return v.topicClassification && v.topicClassification.contentType === c.contentType;
          }).length;
          if (count > bestCount) {
            bestCount = count;
            target = topic;
          }
        });
      }
      if (target) {
        target.videos.push(video);
        other.videos = other.videos.filter(function (v) { return v.id !== video.id; });
      }
    });
  }

  return topicList
    .filter(function (t) { return t.videos.length > 0; })
    .sort(function (a, b) { return b.videos.length - a.videos.length; })
    .slice(0, TOPIC_MAX_MAIN + 1);
}

function buildTopicMetrics(topic, totalVideos, channelAvgViews, channelMedianViews) {
  const views = topic.videos.map(function (v) { return v.viewCount; });
  const sum = views.reduce(function (a, b) { return a + b; }, 0);
  const avgViews = views.length ? sum / views.length : 0;
  const medianViews = medianValue(views);
  const vsChannelAvg = channelAvgViews > 0 ? avgViews / channelAvgViews : 0;
  const breakoutVideos = topic.videos.filter(function (v) {
    return isBreakoutVideo(v.viewCount, channelMedianViews);
  });

  let performanceTier = "average";
  if (vsChannelAvg >= TOPIC_HIGH_RATIO) performanceTier = "high";
  else if (vsChannelAvg < TOPIC_LOW_RATIO) performanceTier = "low";

  return {
    id: topic.id,
    name: topic.name,
    videos: topic.videos,
    videoCount: topic.videos.length,
    contentSharePct: totalVideos > 0 ? Math.round((topic.videos.length / totalVideos) * 100) : 0,
    avgViews: avgViews,
    medianViews: medianViews,
    vsChannelAvg: vsChannelAvg,
    performanceTier: performanceTier,
    breakoutCount: breakoutVideos.length,
    breakoutVideos: breakoutVideos,
  };
}

function identifyEmergingTopics(topics, range) {
  const bounds = getRangeBounds(range);
  const midpoint = new Date((bounds.start.getTime() + bounds.end.getTime()) / 2);
  return topics.filter(function (topic) {
    if (topic.videoCount < 3) return false;
    const recent = topic.videos.filter(function (v) { return new Date(v.publishedAt) >= midpoint; }).length;
    const earlier = topic.videoCount - recent;
    if (recent < 2) return false;
    const growth = recent / Math.max(1, earlier);
    return growth >= 1.4 || (earlier === 0 && recent >= 2);
  }).map(function (topic) {
    const recent = topic.videos.filter(function (v) { return new Date(v.publishedAt) >= midpoint; }).length;
    const earlier = topic.videoCount - recent;
    return Object.assign({}, topic, {
      recentCount: recent,
      earlierCount: earlier,
      growthRatio: recent / Math.max(1, earlier),
    });
  }).sort(function (a, b) { return b.growthRatio - a.growthRatio; }).slice(0, 4);
}

function buildTopicInsights(topics, emergingTopics, breakoutTopics, channelAvgViews) {
  const insights = [];
  const ranked = topics.slice().sort(function (a, b) { return b.vsChannelAvg - a.vsChannelAvg; });
  const strongest = ranked.find(function (t) { return t.videoCount >= 2 && t.vsChannelAvg >= TOPIC_HIGH_RATIO; });
  const weakest = topics.slice().sort(function (a, b) { return a.vsChannelAvg - b.vsChannelAvg; })
    .find(function (t) { return t.videoCount >= 3 && t.contentSharePct >= 12 && t.vsChannelAvg < TOPIC_LOW_RATIO; });

  if (strongest) {
    insights.push(
      strongest.name + " is the strongest topic, generating " +
      formatBreakoutMultiplier(strongest.vsChannelAvg) + " the channel's average views."
    );
  }

  if (emergingTopics.length) {
    const top = emergingTopics[0];
    insights.push(
      top.name + " content is growing, with " + top.recentCount + " video" + (top.recentCount === 1 ? "" : "s") +
      " published in the recent half of this period" +
      (top.earlierCount > 0 ? " vs " + top.earlierCount + " earlier" : "") + "."
    );
  }

  if (weakest && insights.length < 3) {
    insights.push(
      weakest.name + " receives a large share of content (" + weakest.contentSharePct + "%) but performs below the channel average."
    );
  }

  if (!insights.length && topics.length) {
    const top = topics[0];
    insights.push(
      top.name + " is the most-covered topic with " + top.videoCount + " videos (" + top.contentSharePct + "% of content)."
    );
  }

  if (breakoutTopics.length && insights.length < 3) {
    const top = breakoutTopics[0];
    insights.push(
      top.name + " has " + top.breakoutCount + " breakout videos, making it a high-upside topic for this channel."
    );
  }

  return insights.slice(0, 3);
}

function formatVsChannelAvg(ratio) {
  if (!ratio || isNaN(ratio)) return "—";
  return formatBreakoutMultiplier(ratio) + " channel average";
}

function computeContentTopics(classified, range) {
  const bounds = getRangeBounds(range);
  const videos = performanceVideos(classified);
  const currentItems = filterByBounds(videos, bounds.start, bounds.end);

  if (!currentItems.length) {
    return {
      periodLabel: formatDate(bounds.start.toISOString()) + " – " + formatDate(bounds.end.toISOString()),
      hasData: false,
      topics: [],
      emergingTopics: [],
      breakoutTopics: [],
      insights: [],
      channelAvgViews: 0,
      classificationComplete: true,
      classifiedCount: 0,
      pendingCount: 0,
    };
  }

  const classifiedItems = currentItems.filter(function (v) {
    return isValidTopicClassification(v.topicClassification);
  });
  const pendingCount = currentItems.length - classifiedItems.length;
  const classificationComplete = pendingCount === 0;

  const channelViews = currentItems.map(function (v) { return v.viewCount; });
  const channelAvgViews = channelViews.reduce(function (a, b) { return a + b; }, 0) / channelViews.length;
  const channelMedianViews = medianValue(channelViews);

  if (!classifiedItems.length) {
    return {
      periodLabel: formatDate(bounds.start.toISOString()) + " – " + formatDate(bounds.end.toISOString()),
      hasData: true,
      topics: [],
      emergingTopics: [],
      breakoutTopics: [],
      insights: [],
      channelAvgViews: channelAvgViews,
      classificationComplete: false,
      classifiedCount: 0,
      pendingCount: pendingCount,
    };
  }

  const topicGroups = groupVideosByAiTopic(classifiedItems, currentItems.length);
  const topics = topicGroups.map(function (group) {
    return buildTopicMetrics(group, currentItems.length, channelAvgViews, channelMedianViews);
  });

  const emergingTopics = identifyEmergingTopics(topics, range);
  const breakoutTopics = topics
    .filter(function (t) { return t.breakoutCount >= 2; })
    .sort(function (a, b) { return b.breakoutCount - a.breakoutCount; });

  const insights = buildTopicInsights(topics, emergingTopics, breakoutTopics, channelAvgViews);

  return {
    periodLabel: formatDate(bounds.start.toISOString()) + " – " + formatDate(bounds.end.toISOString()),
    hasData: true,
    topics: topics,
    emergingTopics: emergingTopics,
    breakoutTopics: breakoutTopics,
    insights: insights,
    channelAvgViews: channelAvgViews,
    classificationComplete: classificationComplete,
    classifiedCount: classifiedItems.length,
    pendingCount: pendingCount,
  };
}

function performanceTrendLabelStep(count) {
  if (count <= 12) return 1;
  return Math.max(1, Math.ceil(count / 6));
}

function performanceTrendAxisLabel(point, index, total, multiYear) {
  if (multiYear && point.key && point.key.endsWith("-01")) {
    return point.shortLabel + " '" + point.key.slice(2, 4);
  }
  return point.shortLabel;
}

function trendLabelStep(count, granularity) {
  if (granularity === "day") return 1;
  if (granularity === "week" && count <= 8) return 1;
  if (granularity === "week") return 2;
  if (count <= 7) return 1;
  if (count <= 14) return 2;
  return Math.max(1, Math.ceil(count / 6));
}

function PublishingTrendSparkline(props) {
  const trend = props.trend;
  const granularity = props.granularity || "month";
  const [hoverIndex, setHoverIndex] = useState(null);
  if (!trend || !trend.length) return null;

  const hasUploads = trend.some(function (d) { return d.total > 0; });
  const useBars = granularity !== "month" || trend.length <= 16;
  const n = trend.length;
  const maxVal = Math.max(1, trend.reduce(function (m, d) {
    return Math.max(m, d.long, d.short, d.live || 0, d.total);
  }, 0));
  const hover = hoverIndex !== null ? trend[hoverIndex] : null;
  const labelStep = trendLabelStep(n, granularity);
  const isDaily = granularity === "day";
  const granLabel = granularity === "day" ? "Daily" : granularity === "week" ? "Weekly" : "Monthly";

  if (!hasUploads) {
    return <p className="py-4 text-center text-xs text-slate-400">No uploads to chart in this period</p>;
  }

  return (
    <div className="rounded-lg bg-slate-50 p-3">
      <div className="mb-3 flex flex-wrap items-center justify-between gap-2">
        <InsightSectionTitle hint="Number of long-form videos, Shorts, and live streams uploaded in each time bucket. Hover a bar for exact counts.">
          Upload trend
        </InsightSectionTitle>
        <span className="text-[11px] text-slate-400">{granLabel} uploads</span>
      </div>
      <div className="mb-3 flex flex-wrap items-center gap-3 text-[11px] text-slate-500">
        <span className="inline-flex items-center gap-1">
          <span className="inline-block h-2.5 w-2.5 rounded-sm bg-slate-900"></span>
          Long-form
          <InfoTip text="Videos longer than 60 seconds, excluding live streams." placement="bottom" label="Long-form" />
        </span>
        <span className="inline-flex items-center gap-1">
          <span className="inline-block h-2.5 w-2.5 rounded-sm bg-sky-500"></span>
          Shorts
          <InfoTip text="Videos up to 60 seconds, including YouTube Shorts." placement="bottom" label="Shorts" />
        </span>
        <span className="inline-flex items-center gap-1">
          <span className="inline-block h-2.5 w-2.5 rounded-sm bg-rose-500"></span>
          Live
          <InfoTip text="Videos that were streamed live on YouTube." placement="bottom" label="Live" />
        </span>
      </div>
      <div className="relative">
        {hover && (
          <div
            className="pointer-events-none absolute z-10 -translate-x-1/2"
            style={{
              left: n > 0 ? ((hoverIndex + 0.5) / n) * 100 + "%" : "50%",
              top: 0,
            }}
          >
            <div className="whitespace-nowrap rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-[11px] shadow-md">
              <div className="font-semibold text-slate-900">{hover.label}</div>
              <div className="mt-0.5 text-slate-600">
                <span className="text-slate-900">{hover.long}</span> long ·{" "}
                <span className="text-sky-600">{hover.short}</span> shorts
                {(hover.live || 0) > 0 ? (
                  <span> · <span className="text-rose-600">{hover.live}</span> live</span>
                ) : null}
              </div>
            </div>
          </div>
        )}
        <div
          className={"flex items-end gap-px sm:gap-0.5 " + (isDaily ? "h-36" : "h-32")}
          onMouseLeave={function () { setHoverIndex(null); }}
        >
          {trend.map(function (d, i) {
            const active = hoverIndex === i;
            const showLabel = isDaily || i % labelStep === 0 || i === n - 1;
            const longPct = maxVal ? (d.long / maxVal) * 100 : 0;
            const shortPct = maxVal ? (d.short / maxVal) * 100 : 0;
            const livePct = maxVal ? ((d.live || 0) / maxVal) * 100 : 0;
            const barWidth = useBars && n > 16 ? "w-[30%] max-w-2.5" : "w-[30%] max-w-4";
            return (
              <div
                key={d.key}
                className={"flex min-w-0 flex-1 flex-col items-center rounded-md transition-colors " + (active ? "bg-white/80" : "")}
                onMouseEnter={function () { setHoverIndex(i); }}
              >
                <div className={"flex w-full items-end justify-center gap-px " + (isDaily ? "h-20" : "h-24")}>
                  <div
                    className={"rounded-t-sm transition-all " + barWidth + " " + (active ? "bg-slate-900" : "bg-slate-800")}
                    style={{ height: longPct + "%", minHeight: d.long > 0 ? 3 : 0 }}
                  />
                  <div
                    className={"rounded-t-sm transition-all " + barWidth + " " + (active ? "bg-sky-500" : "bg-sky-400")}
                    style={{ height: shortPct + "%", minHeight: d.short > 0 ? 3 : 0 }}
                  />
                  <div
                    className={"rounded-t-sm transition-all " + barWidth + " " + (active ? "bg-rose-500" : "bg-rose-400")}
                    style={{ height: livePct + "%", minHeight: (d.live || 0) > 0 ? 3 : 0 }}
                  />
                </div>
                {showLabel ? (
                  <div className="mt-1.5 flex w-full flex-col items-center leading-tight">
                    <span className={"text-center text-[10px] font-semibold sm:text-[11px] " + (active ? "text-slate-900" : "text-slate-600")}>
                      {d.shortLabel || d.label}
                    </span>
                    {isDaily && d.dayNum != null && (
                      <span className={"text-[10px] " + (active ? "text-slate-500" : "text-slate-400")}>
                        {d.dayNum}
                      </span>
                    )}
                  </div>
                ) : (
                  <div className="mt-1.5 h-4" />
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function ContentPerformancePanel(props) {
  const perf = props.performance;
  const range = props.range;
  const [contentFormat, setContentFormat] = useState("all");
  const [topVideosSort, setTopVideosSort] = useState("views");
  const [showAllTopVideos, setShowAllTopVideos] = useState(false);
  if (!perf) return null;

  const active = (perf.formats && perf.formats[contentFormat]) || perf.formats.all;
  const formatLabels = { all: "all content", long: "long-form", short: "Shorts", live: "Live" };
  const formatEmptyMessages = {
    all: "No videos published in this period to analyze.",
    long: "No long-form videos published in this period.",
    short: "No Shorts published in this period.",
    live: "No live streams published in this period.",
  };

  function handleTopVideosSortChange(next) {
    setTopVideosSort(next);
    setShowAllTopVideos(false);
  }

  function handleFormatChange(next) {
    setContentFormat(next);
    setShowAllTopVideos(false);
    setTopVideosSort("views");
  }

  const recent = active.recentPerformance || {};
  const hasRecentPct = recent.pctChange !== null && recent.pctChange !== undefined && !isNaN(recent.pctChange);
  const recentUp = hasRecentPct && recent.pctChange > 0;
  const typical = active.typicalRange || {};
  const allVideos = active.videos || active.topVideos || [];
  const rankedTopVideos = sortVideosByMetric(allVideos, topVideosSort).slice(0, 5);
  const visibleTopVideos = showAllTopVideos ? rankedTopVideos : rankedTopVideos.slice(0, 3);
  const canShowMoreTopVideos = rankedTopVideos.length > 3;
  const breakoutCount = active.breakoutCount || 0;
  const avgBreakoutMultiplier = active.avgBreakoutMultiplier || 0;
  const breakoutHint = contentFormat === "all"
    ? "Breakout uses each video's own format baseline — long-form vs long-form median, Shorts vs Shorts median, Live vs Live median."
    : "Breakout means at least 2× the typical (median) views for " + formatLabels[contentFormat] + " in this period.";
  const typicalHint = contentFormat === "all"
    ? "Combined view range across all content in this period."
    : "The view range where most " + formatLabels[contentFormat] + " videos in this period landed.";
  const summaryMetrics = [
    {
      label: "Average views/video",
      value: formatNumber(active.avgViews),
      hint: "Total views divided by the number of " + formatLabels[contentFormat] + " videos published in this period.",
    },
    {
      label: "Median views/video",
      value: formatNumber(active.medianViews),
      hint: "The middle result for " + formatLabels[contentFormat] + ". Half earned more, half earned less — less affected by one viral hit than the average.",
    },
    {
      label: "Avg views/day",
      value: formatNumber(active.avgViewsPerDay),
      hint: "Average views per day since publish, for " + formatLabels[contentFormat] + " in this period.",
    },
    {
      label: "Engagement",
      value: formatPercent(active.avgEngagement),
      hint: "Average (likes + comments) ÷ views for " + formatLabels[contentFormat] + ", as a percentage.",
    },
  ];
  const trend = active.performanceTrend || [];
  const trendMax = Math.max(1, trend.reduce(function (m, d) { return Math.max(m, d.avgViews); }, 0));
  const trendScrollable = trend.length > 10;
  const trendLabelStep = performanceTrendLabelStep(trend.length);
  const trendMultiYear = trend.length > 0 && trend[0].key.slice(0, 4) !== trend[trend.length - 1].key.slice(0, 4);

  return (
    <div className="rounded-xl border border-slate-200 bg-white p-4 shadow-sm sm:p-5">
      <PanelSectionHeader
        title={
          <PanelTitle hint="How well videos perform in the selected period — views, engagement, outliers, and trends. Analyze all content or filter by long-form, Shorts, or Live.">
            Content Performance
          </PanelTitle>
        }
        actions={
          <ActivityPeriodControls
            id="content-performance-period"
            value={range}
            onChange={props.onRangeChange}
            hint="The date range used for performance metrics in this section."
            compact={true}
          />
        }
      >
        <ContentFormatSelector value={contentFormat} onChange={handleFormatChange} />
      </PanelSectionHeader>
      {perf.periodLabel && (
        <p className="mt-2 text-[11px] text-slate-400">{perf.periodLabel}</p>
      )}

      {!perf.hasData ? (
        <p className="mt-4 text-sm text-slate-500">No videos published in this period to analyze.</p>
      ) : !active.hasData ? (
        <p className="mt-4 text-sm text-slate-500">{formatEmptyMessages[contentFormat]}</p>
      ) : (
        <>
          <div className="mt-4 rounded-xl bg-slate-50 p-4">
            <div className="grid grid-cols-2 gap-4 sm:grid-cols-4">
              {summaryMetrics.map(function (metric) {
                return (
                  <PerformanceMetricTile
                    key={metric.label}
                    label={metric.label}
                    value={metric.value}
                    hint={metric.hint}
                  />
                );
              })}
            </div>

            {contentFormat === "all" && perf.formatComparison && (
              <FormatComparisonBlock comparison={perf.formatComparison} />
            )}

            {typical.median > 0 && contentFormat !== "all" && (
              <div className="mt-4 border-t border-slate-200/80 pt-3">
                <InsightSectionTitle hint={typicalHint}>
                  Typical performance
                </InsightSectionTitle>
                <p className="mt-1.5 text-sm text-slate-700">
                  Most videos: <span className="font-semibold text-slate-900">{formatNumber(typical.low)}–{formatNumber(typical.high)}</span> views
                  <span className="text-slate-400"> · </span>
                  Median: <span className="font-semibold text-slate-900">{formatNumber(typical.median)}</span>
                </p>
              </div>
            )}
          </div>

          {rankedTopVideos.length > 0 && (
            <div className="mt-5">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <InsightSectionTitle hint={breakoutHint}>
                  Top performing videos
                </InsightSectionTitle>
                <TopVideosSortToggle value={topVideosSort} onChange={handleTopVideosSortChange} />
              </div>
              {breakoutCount > 0 && (
                <p className="mt-2 text-xs text-slate-600">
                  <span className="font-semibold text-amber-800">
                    {breakoutCount} breakout video{breakoutCount === 1 ? "" : "s"}
                  </span>
                  {avgBreakoutMultiplier > 0 && (
                    <span>{" · "}{formatBreakoutMultiplier(avgBreakoutMultiplier)} typical performance</span>
                  )}
                </p>
              )}
              <ol className="mt-2 space-y-2">
                {visibleTopVideos.map(function (video, i) {
                  return (
                    <TopPerformanceVideoRow
                      key={video.id || i}
                      video={video}
                      rank={i + 1}
                      showFormat={contentFormat === "all"}
                      sortBy={topVideosSort}
                    />
                  );
                })}
              </ol>
              {canShowMoreTopVideos && (
                <button
                  type="button"
                  onClick={function () { setShowAllTopVideos(!showAllTopVideos); }}
                  className="mt-2 text-xs font-semibold text-sky-700 hover:text-sky-800"
                >
                  {showAllTopVideos ? "Show less" : "Show more"}
                </button>
              )}
            </div>
          )}

          {trend.length > 0 && (
            <div className="mt-5">
              <div className="mb-2 flex flex-wrap items-center justify-between gap-2">
                <InsightSectionTitle hint="Average views per video for each month in the selected period. Hover a bar for details.">
                  Performance trend
                </InsightSectionTitle>
                <span className="text-[11px] text-slate-400">Monthly avg views</span>
              </div>
              <div className="rounded-xl bg-slate-50 p-3">
                <div className={trendScrollable ? "overflow-x-auto pb-1 -mx-1 px-1" : ""}>
                  <div className={"flex h-28 items-end gap-1.5 " + (trendScrollable ? "min-w-max" : "")}>
                    {trend.map(function (d, i) {
                      const heightPct = trendMax ? (d.avgViews / trendMax) * 100 : 0;
                      const showLabel = trendScrollable || i % trendLabelStep === 0 || i === trend.length - 1;
                      const axisLabel = performanceTrendAxisLabel(d, i, trend.length, trendMultiYear);
                      const barColor = contentFormat === "short"
                        ? "bg-sky-500 group-hover:bg-sky-600"
                        : "bg-slate-700 group-hover:bg-slate-900";
                      return (
                        <div
                          key={d.key}
                          className={
                            "group relative flex flex-col items-center rounded-md transition-colors hover:bg-white/70 " +
                            (trendScrollable ? "w-9 shrink-0" : "min-w-0 flex-1")
                          }
                        >
                          <div className="pointer-events-none absolute bottom-full left-1/2 z-10 mb-2 hidden -translate-x-1/2 group-hover:block">
                            <div className="whitespace-nowrap rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-[11px] shadow-md">
                              <div className="font-semibold text-slate-900">{d.label}</div>
                              <div className="mt-0.5 text-slate-600">
                                {formatNumber(d.avgViews)} avg views
                                {d.count > 0 && (
                                  <span className="text-slate-400"> · {d.count} video{d.count === 1 ? "" : "s"}</span>
                                )}
                              </div>
                            </div>
                          </div>
                          <div className="flex h-20 w-full items-end justify-center px-0.5">
                            <div
                              className={"w-full max-w-7 rounded-t-md transition-all " + barColor}
                              style={{ height: heightPct + "%", minHeight: d.avgViews > 0 ? 4 : 0 }}
                            />
                          </div>
                          {showLabel ? (
                            <span className="mt-1.5 text-center text-[10px] font-medium text-slate-500 group-hover:text-slate-900">
                              {axisLabel}
                            </span>
                          ) : (
                            <span className="mt-1.5 h-3.5" />
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {recent.avgViews !== null && recent.avgViews !== undefined && (
            <div className="mt-5 rounded-xl bg-slate-50 p-4">
              <InsightSectionTitle hint="Compares average views per video in this period to the previous period of the same length.">
                Recent performance
              </InsightSectionTitle>
              <div className="mt-3 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
                <div>
                  <p className="text-[11px] font-medium uppercase tracking-wide text-slate-400">This period</p>
                  <p className="mt-0.5 text-2xl font-bold text-slate-900">{formatNumber(recent.avgViews)}</p>
                  <p className="text-xs text-slate-500">avg views/video</p>
                </div>
                <div className="hidden h-10 w-px bg-slate-200 sm:block"></div>
                <div>
                  <p className="text-[11px] font-medium uppercase tracking-wide text-slate-400">Previous period</p>
                  <p className="mt-0.5 text-2xl font-bold text-slate-600">
                    {recent.previousAvgViews > 0 ? formatNumber(recent.previousAvgViews) : "—"}
                  </p>
                  <p className="text-xs text-slate-500">avg views/video</p>
                </div>
                {(hasRecentPct || (!recent.previousAvgViews && recent.avgViews > 0)) && (
                  <div className="sm:text-right">
                    {hasRecentPct && (
                      <p className={"text-lg font-bold " + (recentUp ? "text-emerald-600" : "text-rose-500")}>
                        {recentUp ? "↑" : "↓"}{Math.abs(Math.round(recent.pctChange))}%
                      </p>
                    )}
                    {!hasRecentPct && !recent.previousAvgViews && recent.avgViews > 0 && (
                      <p className="text-sm font-semibold text-emerald-600">New activity</p>
                    )}
                    <p className="text-xs text-slate-500">vs previous period</p>
                  </div>
                )}
              </div>
            </div>
          )}

          {active.keyInsight && (
            <div className="mt-5 rounded-xl border border-slate-200 bg-gradient-to-br from-slate-50 to-white p-4">
              <InsightSectionTitle hint="A plain-language summary of the most important performance pattern for the selected format.">
                Key insight
              </InsightSectionTitle>
              <p className="mt-2 text-sm leading-relaxed text-slate-700">{active.keyInsight}</p>
            </div>
          )}
        </>
      )}
    </div>
  );
}

function TopicPerformanceBadge(props) {
  if (props.tier === "high") {
    return <span className="shrink-0 rounded-full bg-emerald-50 px-2 py-0.5 text-[10px] font-semibold uppercase text-emerald-700">High performer</span>;
  }
  if (props.tier === "low") {
    return <span className="shrink-0 rounded-full bg-rose-50 px-2 py-0.5 text-[10px] font-semibold uppercase text-rose-700">Underperforming</span>;
  }
  return null;
}

      <div className="flex items-start gap-3">

        </span>

              target="_blank"

              className="line-clamp-1 font-semibold text-slate-900 hover:text-sky-700"
              onClick={function (e) { e.stopPropagation(); }}
            >
              {video.title}
            </a>
            {video.category === "short" || video.category === "long" ? (

function TopicCard(props) {

  const expanded = props.expanded;
  const onToggle = props.onToggle;
  const tierClass = topic.performanceTier === "high"
    ? "border-emerald-100 bg-emerald-50/40"
    : topic.performanceTier === "low"
      ? "border-rose-100 bg-rose-50/30"

        aria-expanded={expanded}
      >
        <div className="min-w-0 flex-1">
          <div className="flex flex-wrap items-center gap-x-2 gap-y-1">
            <span className="text-sm font-semibold text-slate-900">{topic.name}</span>
            <TopicPerformanceBadge tier={topic.performanceTier} />
          </div>
          <p className="mt-1 text-sm text-slate-600">
            {topic.videoCount} video{topic.videoCount === 1 ? "" : "s"}
            <span className="text-slate-300"> · </span>
            {topic.contentSharePct}% of content
            <span className="text-slate-300"> · </span>
            {formatNumber(topic.avgViews)} avg views
            <span className="text-slate-300"> · </span>
            {formatNumber(topic.medianViews)} median
            <span className="text-slate-300"> · </span>
            <span className={
              topic.performanceTier === "high" ? "font-semibold text-emerald-700" :
              topic.performanceTier === "low" ? "font-semibold text-rose-600" : "font-medium text-slate-700"
            }>
              {formatVsChannelAvg(topic.vsChannelAvg)}
            </span>
          </p>
        </div>
        <span className={"mt-1 shrink-0 text-slate-400 transition " + (expanded ? "rotate-180" : "")} aria-hidden="true">
          ▾
        </span>
      </button>
      {expanded && (
        <div className="border-t border-slate-200/70 px-3 pb-3 pt-2">
          <p className="mb-2 text-[11px] font-medium uppercase tracking-wide text-slate-400">
            Videos in this topic
          </p>
          {videos.length === 0 ? (
            <p className="text-sm text-slate-500">No videos in this topic.</p>
          ) : (
            <ol className="space-y-2">
              {videos.map(function (video, i) {
                return <TopicVideoRow key={video.id || i} video={video} rank={i + 1} />;
              })}
            </ol>
          )}
        </div>
      )}
    </div>
  );
}

function ContentTopicsPanel(props) {
  const data = props.topics;
  const range = props.range;
  const [classifying, setClassifying] = useState(false);
  const [classifyMsg, setClassifyMsg] = useState("");
  const [classifyError, setClassifyError] = useState(null);
  const [expandedTopicId, setExpandedTopicId] = useState(null);
  const classifyGenRef = useRef(0);
  const unclassifiedCount = useMemo(function () {
    if (!props.allVideos || !props.allVideos.length) return 0;
    const bounds = getRangeBounds(props.range);
    const periodVideos = filterByBounds(performanceVideos(props.allVideos), bounds.start, bounds.end);
    return periodVideos.filter(function (v) {
      return !isValidTopicClassification(v.topicClassification);
    }).length;
  }, [props.allVideos, props.range]);

  useEffect(function () {
    classifyGenRef.current++;
    setClassifying(false);
    setClassifyMsg("");
    setClassifyError(null);
  }, [props.channelId]);

  const runClassification = useCallback(function () {
    if (!props.channelId || !props.allVideos || !props.allVideos.length || !unclassifiedCount || classifying) return;
    if (props.canUseGemini === false) {
      setClassifyError("AI topic analysis is currently turned off for users. Admins can still use it.");
      return;
    }

    const gen = ++classifyGenRef.current;
    const bounds = getRangeBounds(range);
    const periodVideos = filterByBounds(performanceVideos(props.allVideos), bounds.start, bounds.end);
    const priorityIds = {};
    periodVideos.forEach(function (v) { priorityIds[v.id] = true; });

    setClassifying(true);
    setClassifyError(null);
    setClassifyMsg("Checking saved topic classifications…");

    classifyVideosWithGemini(props.channelId, props.allVideos, {
      canUseGemini: props.canUseGemini !== false,
      priorityIds: priorityIds,
      periodOnly: true,
      onProgress: function (done, total) {
        if (gen !== classifyGenRef.current) return;
        if (total > 0) setClassifyMsg("Classifying topics with Gemini AI… " + done + "/" + total);
      },
    }).then(function (result) {
      if (gen !== classifyGenRef.current) return;
      if (props.onClassificationsUpdated) props.onClassificationsUpdated();
      if (result && result.classified === 0 && result.loadedFromCache > 0) {
        setClassifyMsg("Loaded " + result.loadedFromCache + " topic" + (result.loadedFromCache === 1 ? "" : "s") + " from database — no Gemini API used.");
      } else if (result && result.classified === 0 && result.total === 0) {
        setClassifyMsg("All topics for this period are already saved in the database.");
      }
      if (result && result.stoppedEarly && result.stopReason) {
        setClassifyError(result.stopReason);
      }
    }).catch(function (e) {
      if (gen !== classifyGenRef.current) return;
      if (props.onClassificationsUpdated) props.onClassificationsUpdated();
      setClassifyError(e.message || String(e));
    }).finally(function () {
      if (gen === classifyGenRef.current) setClassifying(false);
    });
  }, [props.channelId, props.allVideos, props.onClassificationsUpdated, props.canUseGemini, unclassifiedCount, classifying, range]);

  if (!data) return null;

  const canRunClassification = data.hasData && unclassifiedCount > 0 && props.canUseGemini !== false;
  const geminiDisabled = props.canUseGemini === false && unclassifiedCount > 0;

  return (
    <div className="rounded-xl border border-slate-200 bg-white p-4 shadow-sm sm:p-5">
      <PanelSectionHeader
        title={
          <PanelTitle hint="What topics this channel covers, how much focus each gets, which perform best, and how the mix is shifting. Click Run to classify new videos with Gemini AI — already-classified videos are loaded from the database without using Gemini.">
            Content Topics
          </PanelTitle>
        }
        actions={
          <>
            {canRunClassification && (
              <button
                type="button"
                onClick={runClassification}
                disabled={classifying}
                className="inline-flex h-[34px] items-center justify-center gap-1.5 rounded-lg bg-slate-900 px-3 text-xs font-semibold text-white transition hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-50"
              >
                {classifying ? <Spinner className="h-3.5 w-3.5 text-white" /> : null}
                {classifying ? "Running…" : "Run"}
              </button>
            )}
            <ActivityPeriodControls
              id="content-topics-period"
              value={range}
              onChange={props.onRangeChange}
              hint="The date range used for topic analysis in this section."
              compact={true}
            />
          </>
        }
      />
      {data.periodLabel && (
        <p className="mt-2 text-[11px] text-slate-400">{data.periodLabel}</p>
      )}

      {geminiDisabled && (
        <div className="mt-3 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2.5 text-sm text-amber-800">
          AI topic analysis is turned off for users right now. You can still view topics already saved in the database.
        </div>
      )}

      {(classifying || classifyError) && (
        <div className={"mt-3 flex items-start gap-2 rounded-lg border px-3 py-2.5 text-sm " +
          (classifyError
            ? (classifyError.indexOf("quota") >= 0 || classifyError.indexOf("Quota") >= 0
              ? "border-amber-200 bg-amber-50 text-amber-800"
              : "border-rose-200 bg-rose-50 text-rose-700")
            : "border-slate-200 bg-slate-50 text-slate-600")}>
          {classifying && !classifyError ? <Spinner className="mt-0.5 h-4 w-4 shrink-0 text-slate-500" /> : null}
          <span>{classifyError || classifyMsg}</span>
        </div>
      )}

      {!data.hasData ? (
        <p className="mt-4 text-sm text-slate-500">No videos published in this period to analyze topics.</p>
      ) : data.topics.length === 0 && classifying ? (
        <p className="mt-4 text-sm text-slate-500">
          Analyzing video topics for this period. Results will appear shortly.
        </p>
      ) : data.topics.length === 0 && canRunClassification ? (
        <div className="mt-4 rounded-xl border border-dashed border-slate-200 bg-slate-50/80 px-4 py-5 text-center">
          <p className="text-sm font-medium text-slate-700">Topic analysis is ready to run</p>
          <p className="mt-1 text-sm text-slate-500">
            This step uses Gemini AI to classify videos in the selected period. It does not start automatically so you can avoid unnecessary API usage.
          </p>
          <button
            type="button"
            onClick={runClassification}
            disabled={classifying}
            className="mt-4 inline-flex items-center justify-center gap-2 rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-50"
          >
            {classifying ? <Spinner className="h-4 w-4 text-white" /> : null}
            {classifying ? "Running…" : "Run topic analysis"}
          </button>
        </div>
      ) : (
        <>
          <div className="mt-4">
            <InsightSectionTitle hint="Meaningful topic categories assigned by Gemini AI. Metrics are calculated locally from video performance data.">
              Main topics
            </InsightSectionTitle>
            {!data.classificationComplete && data.pendingCount > 0 && (
              <p className="mt-1 text-[11px] text-slate-500">
                Showing {data.classifiedCount} classified video{data.classifiedCount === 1 ? "" : "s"} · {data.pendingCount} unclassified
                {!classifying && canRunClassification ? " — click Run to classify the rest" : (classifying ? " · classifying…" : (geminiDisabled ? " · AI analysis is currently disabled" : ""))}
              </p>
            )}
            {data.topics.some(function (t) { return t.performanceTier !== "average"; }) && (
              <div className="mt-1.5 flex flex-wrap gap-x-4 gap-y-1 text-xs">
                {data.topics.filter(function (t) { return t.performanceTier === "high"; }).length > 0 && (
                  <p>
                    <span className="font-semibold text-emerald-700">High performing: </span>
                    <span className="text-slate-600">
                      {data.topics.filter(function (t) { return t.performanceTier === "high"; }).map(function (t) { return t.name; }).join(", ")}
                    </span>
                  </p>
                )}
                {data.topics.filter(function (t) { return t.performanceTier === "low"; }).length > 0 && (
                  <p>
                    <span className="font-semibold text-rose-600">Underperforming: </span>
                    <span className="text-slate-600">
                      {data.topics.filter(function (t) { return t.performanceTier === "low"; }).map(function (t) { return t.name; }).join(", ")}
                    </span>
                  </p>
                )}
              </div>
            )}
            <div className="mt-2 space-y-2">
              {data.topics.map(function (topic) {

function ActivityPeriodControls(props) {
  const range = props.value;
  const selectId = props.id || "activity-period";
  const selectValue = range.type === "preset" ? ("preset:" + range.days) : "custom";
  const fieldCls = "rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-200";
  const dateCls = "rounded-lg border border-slate-200 bg-white px-2 py-2 text-sm text-slate-700 outline-none focus:border-slate-400";

  function applyCustom(start, end) {
    if (!start || !end || start > end) return;
    props.onChange({ type: "custom", start: start, end: end });
  }

  const compactRow = props.compact && range.type !== "custom";

  return (
    <div className={"flex flex-wrap items-center gap-2 " + (compactRow ? "w-full sm:w-auto" : "w-full sm:w-auto")}>
      <div className={"flex min-w-0 items-center gap-2 " + (compactRow ? "" : "w-full sm:w-auto")}>
        <label htmlFor={selectId} className="flex shrink-0 items-center gap-1 text-xs font-medium text-slate-500">
          <span>Period</span>
          {props.hint ? <InfoTip text={props.hint} placement="bottom" label="Period" /> : null}
        </label>
        <select
          id={selectId}
          value={selectValue}
          onChange={function (e) {
            const v = e.target.value;
            if (v === "custom") {
              const end = new Date();
              const start = new Date();
              start.setMonth(start.getMonth() - 6);
              props.onChange({ type: "custom", start: toInputDate(start), end: toInputDate(end) });
              return;
            }
            props.onChange({ type: "preset", days: parseInt(v.split(":")[1], 10) });
          }}
          className={fieldCls + " w-full min-w-0 sm:min-w-[140px]"}
        >
          {ACTIVITY_PERIODS.map(function (p) {
            return <option key={p.days} value={"preset:" + p.days}>{p.label}</option>;
          })}
          <option value="custom">Custom range…</option>
        </select>
      </div>
      {range.type === "custom" && (
        <div className="flex w-full flex-col gap-2 sm:w-auto sm:flex-row sm:items-center">
          <input
            type="date"
            value={range.start}
            onChange={function (e) { applyCustom(e.target.value, range.end); }}
            className={dateCls + " w-full min-w-0 sm:w-auto"}
          />
          <span className="hidden text-xs text-slate-400 sm:inline">–</span>
          <input
            type="date"
            value={range.end}
            onChange={function (e) { applyCustom(range.start, e.target.value); }}
            className={dateCls + " w-full min-w-0 sm:w-auto"}
          />
        </div>
      )}
    </div>
  );
}

function AuthScreen(props) {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [displayName, setDisplayName] = useState("");
  const [rememberMe, setRememberMe] = useState(true);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const submit = async function (e) {
    e.preventDefault();
    setError(null);

    if (!email.trim()) {
      setError("Enter your email address.");
      return;
    }
    if (!password) {
      setError("Enter your password.");
      return;
    }
    if (mode === "signup") {
      if (password.length < 6) {
        setError("Password must be at least 6 characters.");
        return;
      }
      if (password !== confirmPassword) {
        setError("Passwords do not match.");
        return;
      }
    }

    setLoading(true);
    try {
      if (mode === "signup") {
        await apiRequest("/auth/signup", {
          method: "POST",
          body: { email: email.trim(), password: password, displayName: displayName.trim() || undefined },
        });
      }
      const result = await apiRequest("/auth/login", {
        method: "POST",
        body: { email: email.trim(), password: password, rememberMe: rememberMe },
      });
      storeAuthToken(result.token, result.rememberMe);
      props.onAuthSuccess(result.user);
    } catch (err) {
      setError(formatApiError(err));
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="flex min-h-screen items-center justify-center bg-slate-50 px-5 py-10">
      <div className="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        <div className="mb-6 text-center">
          <div className="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-2xl bg-slate-900 text-lg font-bold text-white">Y</div>
          <h1 className="text-xl font-bold text-slate-900">YouTube Channel Analyzer</h1>
          <p className="mt-1 text-sm text-slate-500">
            {mode === "login" ? "Sign in to continue" : "Create your free account"}
          </p>
        </div>

        <div className="mb-6 flex rounded-xl bg-slate-100 p-1">
          <button
            type="button"
            onClick={function () { setMode("login"); setError(null); }}
            className={"flex-1 rounded-lg px-3 py-2 text-sm font-semibold transition " +
              (mode === "login" ? "bg-white text-slate-900 shadow-sm" : "text-slate-500 hover:text-slate-700")}
          >
            Sign in
          </button>
          <button
            type="button"
            onClick={function () { setMode("signup"); setError(null); }}
            className={"flex-1 rounded-lg px-3 py-2 text-sm font-semibold transition " +
              (mode === "signup" ? "bg-white text-slate-900 shadow-sm" : "text-slate-500 hover:text-slate-700")}
          >
            Create account
          </button>
        </div>

        <form className="space-y-4" onSubmit={submit}>
          {mode === "signup" && (
            <div>
              <label className="mb-1.5 block text-sm font-medium text-slate-700">Name</label>
              <input
                type="text"
                autoComplete="name"
                value={displayName}
                onChange={function (e) { setDisplayName(e.target.value); }}
                placeholder="Your name (optional)"
                className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 placeholder-slate-400 outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200"
              />
            </div>
          )}

          <div>
            <label className="mb-1.5 block text-sm font-medium text-slate-700">Email</label>
            <input
              type="email"
              autoComplete="email"
              required
              value={email}
              onChange={function (e) { setEmail(e.target.value); }}
              placeholder="you@example.com"
              className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 placeholder-slate-400 outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200"
            />
          </div>

          <div>
            <label className="mb-1.5 block text-sm font-medium text-slate-700">Password</label>
            <input
              type="password"
              autoComplete={mode === "signup" ? "new-password" : "current-password"}
              required
              value={password}
              onChange={function (e) { setPassword(e.target.value); }}
              placeholder={mode === "signup" ? "At least 6 characters" : "Your password"}
              className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 placeholder-slate-400 outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200"
            />
          </div>

          {mode === "signup" && (
            <div>
              <label className="mb-1.5 block text-sm font-medium text-slate-700">Confirm password</label>
              <input
                type="password"
                autoComplete="new-password"
                required
                value={confirmPassword}
                onChange={function (e) { setConfirmPassword(e.target.value); }}
                placeholder="Repeat your password"
                className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 placeholder-slate-400 outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200"
              />
            </div>
          )}

          {mode === "login" && (
            <label className="flex cursor-pointer items-center gap-2.5 text-sm text-slate-600">
              <input
                type="checkbox"
                checked={rememberMe}
                onChange={function (e) { setRememberMe(e.target.checked); }}
                className="h-4 w-4 rounded border-slate-300 text-slate-900 focus:ring-slate-300"
              />
              Keep me signed in
            </label>
          )}

          {error && (
            <div className="rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-600">
              {error}
            </div>
          )}

          <button
            type="submit"
            disabled={loading}
            className="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white transition hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-50"
          >
            {loading && <Spinner className="h-4 w-4 text-white" />}
            {loading
              ? (mode === "login" ? "Signing in…" : "Creating account…")
              : (mode === "login" ? "Sign in" : "Create account")}
          </button>
        </form>
      </div>
    </div>
  );
}

function App() {
  const [authUser, setAuthUser] = useState(function () {
    if (!API_BASE || !getStoredAuthToken()) return null;
    return loadCachedAuthUser();
  });
  const [channelUsage, setChannelUsage] = useState(null);
  const [geminiTopicAnalysis, setGeminiTopicAnalysis] = useState(true);
  const [authLoading, setAuthLoading] = useState(function () {
    if (!API_BASE) return false;
    return !!getStoredAuthToken() && !loadCachedAuthUser();
  });
  const [channelInput, setChannelInput] = useState("");
  const [phase, setPhase] = useState("idle"); // idle | loading | done | error
  const [refreshing, setRefreshing] = useState(false);
  const [statusMsg, setStatusMsg] = useState("");
  const [error, setError] = useState(null);
  const [cacheWarning, setCacheWarning] = useState(null);
  const [result, setResult] = useState(null);
  const [favorites, setFavorites] = useState(function () {
    if (API_BASE) return loadSavedChannelsCache();
    return loadFavorites();
  });
  const [activityRange, setActivityRange] = useState(DEFAULT_ACTIVITY_RANGE);
  const [contentPerformanceRange, setContentPerformanceRange] = useState(DEFAULT_ACTIVITY_RANGE);
  const [contentTopicsRange, setContentTopicsRange] = useState(DEFAULT_ACTIVITY_RANGE);
  const analysisGenRef = useRef(0);

  useEffect(function () {
    if (!API_BASE) {
      setAuthLoading(false);
      return;
    }
    const token = getStoredAuthToken();
    if (!token) {
      setAuthLoading(false);
      return;
    }
    apiRequest("/auth/me")
      .then(function (data) {
        setAuthUser(data.user);
        setChannelUsage(data.usage || null);
        setGeminiTopicAnalysis(data.features ? data.features.geminiTopicAnalysis !== false : true);
        persistCachedAuthUser(data.user);
        refreshSavedChannelsInBackground(setFavorites);
      })
      .catch(function () {
        clearAuthToken();
      })
      .finally(function () {
        setAuthLoading(false);
      });
  }, []);

  const handleLogout = useCallback(async function () {
    try {
      await apiRequest("/auth/logout", { method: "POST" });
    } catch (e) {
      // ignore — clear local session anyway
    }
    clearAuthToken();
    setAuthUser(null);
    setChannelUsage(null);
    setGeminiTopicAnalysis(true);
    setResult(null);
    setPhase("idle");
    setError(null);
    setFavorites([]);
    try { localStorage.removeItem(SAVED_CHANNELS_CACHE_KEY); } catch (e) { /* ignore */ }
  }, []);

  useEffect(function () {
    migrateLegacyChannelCache();
    loadFavorites().forEach(function (fav) {
      if (fav.id) loadChannelCache(fav.id);
    });
  }, []);

  const applyCacheEntry = useCallback(function (entry) {
    setResult(buildResultFromCache(entry));
    setPhase("done");
  }, []);

  const runBackgroundRefresh = useCallback(async function (cacheEntry, gen) {
    if (!API_BASE) {
      const apiKey = YOUTUBE_API_KEY;
      if (!apiKey) return;
      setRefreshing(true);
      setStatusMsg("Updating channel data…");
      try {
        const updated = await refreshChannelCache(apiKey, cacheEntry, function (msg) {
          if (gen !== analysisGenRef.current) return;
          setStatusMsg(msg);
        });
        if (gen !== analysisGenRef.current) return;
        applyCacheEntry(updated);
        setCacheWarning(null);
      } catch (e) {
        if (gen !== analysisGenRef.current) return;
        const msg = e && e.code === "QUOTA_EXCEEDED"
          ? e.message
          : (e && e.message ? e.message : "Background update failed.");
        setCacheWarning(msg);
      } finally {
        if (gen === analysisGenRef.current) {
          setRefreshing(false);
          setStatusMsg("");
        }
      }
      return;
    }

    setRefreshing(true);
    setStatusMsg("Updating channel data…");
    try {
      const handle = cacheEntry.channel && cacheEntry.channel.title
        ? ("https://www.youtube.com/channel/" + cacheEntry.channelId)
        : cacheEntry.channelId;
      let response = await analyzeChannelViaApi(handle, function (msg) {
        if (gen !== analysisGenRef.current) return;
        setStatusMsg(msg);
      }, { channelId: cacheEntry.channelId });
      if (gen !== analysisGenRef.current) return;
      if (response.usage) setChannelUsage(response.usage);
      let entry = response.entry;
      entry = await mergeTopicClassificationsFromCache(entry);
      if (gen !== analysisGenRef.current) return;
      await saveChannelCache(entry);
      if (gen !== analysisGenRef.current) return;
      applyCacheEntry(entry);
      setCacheWarning(null);
    } catch (e) {
      if (gen !== analysisGenRef.current) return;
      setCacheWarning(e && e.message ? e.message : "Background update failed.");
    } finally {
      if (gen === analysisGenRef.current) {
        setRefreshing(false);
        setStatusMsg("");
      }
    }
  }, [applyCacheEntry]);

  const persistAnalysisResult = useCallback(async function (cacheEntry, gen) {
    const interim = {
      version: CACHE_VERSION,
      channelId: cacheEntry.channelId,
      lastAnalyzedAt: cacheEntry.lastSyncedAt || cacheEntry.lastAnalyzedAt,
      lastSyncedAt: cacheEntry.lastSyncedAt || cacheEntry.lastAnalyzedAt,
      channel: cacheEntry.channel,
      videoIds: cacheEntry.videoIds,
      rawVideos: cacheEntry.rawVideos.map(compactRawVideo).filter(Boolean),
      topicClassifications: cacheEntry.topicClassifications || {},
    };
    memoryChannelCache.set(cacheEntry.channelId, interim);
    applyCacheEntry(interim);
    saveChannelCache(cacheEntry).then(function () {
      if (gen === analysisGenRef.current) setCacheWarning(null);
    }).catch(function (e) {
      if (gen !== analysisGenRef.current) return;
      if (e && e.code === "QUOTA_EXCEEDED") {
        setCacheWarning(e.message);
      } else {
        setCacheWarning((e && e.message) || "Could not save channel cache.");
      }
    });
  }, [applyCacheEntry]);

  const showCachedChannel = useCallback(function (cached, gen) {
    applyCacheEntry(cached);
    if (API_BASE && getStoredAuthToken() && cached && cached.channelId) {
      hydrateTopicClassificationsForEntry(cached).then(function (entry) {
        if (gen !== analysisGenRef.current) return;
        saveChannelCache(entry).then(function () {
          if (gen !== analysisGenRef.current) return;
          applyCacheEntry(entry);
        }).catch(function () {
          if (gen !== analysisGenRef.current) return;
          applyCacheEntry(entry);
        });
      }).catch(function () { /* keep cached view */ });
    }
    if (isCacheFresh(cached)) {
      setRefreshing(false);
      setStatusMsg("");
      return true;
    }
    runBackgroundRefresh(cached, gen);
    return true;
  }, [applyCacheEntry, runBackgroundRefresh]);

  const runAnalysis = useCallback(async function (rawOverride, options) {
    const opts = options || {};
    const raw = (typeof rawOverride === "string" && rawOverride.trim()) ? rawOverride.trim() : channelInput;

    const gen = ++analysisGenRef.current;
    setError(null);
    setCacheWarning(null);

    const hintedId = opts.channelId || channelIdFromInput(raw);

    const syncCached = hintedId ? loadChannelCacheSync(hintedId) : null;
    if (syncCached && !opts.force) {
      showCachedChannel(syncCached, gen);
      return;
    }

    if (hintedId && !opts.force) {
      const dbCached = await loadChannelCache(hintedId);
      if (gen !== analysisGenRef.current) return;
      if (dbCached) {
        showCachedChannel(dbCached, gen);
        return;
      }
    }

    setRefreshing(false);

    try {
      const attempts = parseChannelInput(raw);
      if (!attempts) throw new Error("Enter a channel name, @handle, or URL.");

      if (API_BASE) {
        if (!syncCached) {
          setPhase("loading");
          setStatusMsg(opts.channelId ? "Loading saved channel…" : "Checking shared database cache…");
        }
        let response = await analyzeChannelViaApi(raw, function (msg) {
          if (gen !== analysisGenRef.current) return;
          setStatusMsg(msg);
        }, { channelId: opts.channelId });
        if (gen !== analysisGenRef.current) return;
        if (response.usage) setChannelUsage(response.usage);
        let entry = response.entry;
        entry = await mergeTopicClassificationsFromCache(entry);
        setActivityRange(DEFAULT_ACTIVITY_RANGE);
        setContentPerformanceRange(DEFAULT_ACTIVITY_RANGE);
        setContentTopicsRange(DEFAULT_ACTIVITY_RANGE);
        await persistAnalysisResult(entry, gen);
        return;
      }

      if (!syncCached) {
        setPhase("loading");
        setStatusMsg("Resolving channel…");
      }

      const apiKey = YOUTUBE_API_KEY;
      const channel = await resolveChannel(apiKey, attempts);
      if (gen !== analysisGenRef.current) return;

      const existingCache = await loadChannelCache(channel.id);
      if (gen !== analysisGenRef.current) return;
      if (existingCache && !opts.force) {
        showCachedChannel(existingCache, gen);
        return;
      }

      setResult(null);
      setPhase("loading");
      setActivityRange(DEFAULT_ACTIVITY_RANGE);
      setContentPerformanceRange(DEFAULT_ACTIVITY_RANGE);
      setContentTopicsRange(DEFAULT_ACTIVITY_RANGE);

      const cacheEntry = await fetchFullChannelData(apiKey, channel, function (msg) {
        if (gen !== analysisGenRef.current) return;
        setStatusMsg(msg);
      });
      if (gen !== analysisGenRef.current) return;

      await persistAnalysisResult(cacheEntry, gen);
    } catch (e) {
      if (gen !== analysisGenRef.current) return;
      if (e && e.code === "QUOTA_EXCEEDED") {
        setCacheWarning(e.message);
        setPhase("done");
        return;
      }
      setError(e && e.message ? e.message : String(e));
      setPhase("error");
    }
  }, [channelInput, applyCacheEntry, showCachedChannel, persistAnalysisResult]);

  const removeFavorite = useCallback(async function (id) {
    if (API_BASE) {
      try {
        const channels = await removeChannelFromApi(id);
        applyFavoritesUpdate(setFavorites, channels);
      } catch (e) {
        setCacheWarning(e.message || "Could not remove saved channel.");
      }
      return;
    }
    setFavorites(function (prev) {
      const next = prev.filter(function (f) { return f.id !== id; });
      persistFavorites(next);
      return next;
    });
  }, []);

  const toggleFavorite = useCallback(async function () {
    if (!result || !result.channel) return;
    const ch = result.channel;
    if (API_BASE) {
      const exists = favorites.some(function (f) { return f.id === ch.id; });
      try {
        const channels = exists
          ? await removeChannelFromApi(ch.id)
          : await saveChannelToApi(ch);
        applyFavoritesUpdate(setFavorites, channels);
      } catch (e) {
        setCacheWarning(e.message || "Could not update saved channel.");
      }
      return;
    }
    setFavorites(function (prev) {
      const exists = prev.some(function (f) { return f.id === ch.id; });
      const next = exists
        ? prev.filter(function (f) { return f.id !== ch.id; })
        : [{
            id: ch.id,
            title: ch.title,
            thumbnail: ch.thumbnail || "",
            query: "https://www.youtube.com/channel/" + ch.id,
          }].concat(prev);
      persistFavorites(next);
      return next;
    });
  }, [result, favorites]);

  const openFavorite = useCallback(function (fav) {
    runAnalysis(fav.query || fav.id, { channelId: fav.id });
  }, [runAnalysis]);

  const refreshTopicClassifications = useCallback(async function () {
    if (!result || !result.channel) return;
    try {
      let entry = loadChannelCacheSync(result.channel.id) || await loadChannelCache(result.channel.id);
      if (!entry) {
        entry = {
          version: CACHE_VERSION,
          channelId: result.channel.id,
          channel: result.channel,
          videoIds: result.classified.map(function (v) { return v.id; }),
          rawVideos: result.classified.map(function (v) { return v.raw || v; }),
          topicClassifications: {},
          lastSyncedAt: result.lastAnalyzedAt,
          lastAnalyzedAt: result.lastAnalyzedAt,
        };
      }
      entry = await hydrateTopicClassificationsForEntry(entry);
      memoryChannelCache.set(result.channel.id, entry);
      await saveChannelCache(entry);
      setResult(buildResultFromCache(entry));
    } catch (e) {
      console.warn("Could not refresh topic classifications:", e);
    }
  }, [result]);

  useEffect(function () {
    if (!result || !result.channel || !API_BASE || !getStoredAuthToken()) return;
    refreshTopicClassifications();
  }, [result && result.channel ? result.channel.id : null]);

  const isInitialLoading = phase === "loading" && !result;

  const publishingInsights = useMemo(function () {
    if (!result || !result.classified) return null;
    return computePublishingInsights(result.classified, activityRange);
  }, [result, activityRange]);

  const contentPerformance = useMemo(function () {
    if (!result || !result.classified) return null;
    return computeContentPerformance(result.classified, contentPerformanceRange);
  }, [result, contentPerformanceRange]);

  const contentTopics = useMemo(function () {
    if (!result || !result.classified) return null;
    return computeContentTopics(result.classified, contentTopicsRange);
  }, [result, contentTopicsRange]);

  const form = (
    <ChannelForm
      value={channelInput}
      onChange={setChannelInput}
      onSubmit={runAnalysis}
      phase={isInitialLoading ? "loading" : phase}
      compact={true}
    />
  );

  if (API_BASE && authLoading) {
    return (
      <div className="flex min-h-screen items-center justify-center bg-slate-50">
        <LoadingState message="Checking your session…" />
      </div>
    );
  }

  if (API_BASE && !authUser) {
    return <AuthScreen onAuthSuccess={function (user) {
      setAuthUser(user);
      persistCachedAuthUser(user);
      refreshSavedChannelsInBackground(setFavorites);
      apiRequest("/auth/me").then(function (data) {
        if (data.usage) setChannelUsage(data.usage);
        setGeminiTopicAnalysis(data.features ? data.features.geminiTopicAnalysis !== false : true);
      }).catch(function () { /* ignore */ });
    }} />;
  }

  return (
    <div className="min-h-screen bg-slate-50">
      <header className="sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur">
        <div className="app-container py-3 sm:py-4">
          <div className="flex flex-col gap-3 xl:grid xl:grid-cols-[auto_1fr_auto] xl:items-center xl:gap-6">
            <div className="flex min-w-0 shrink-0 items-center gap-2">
              <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-slate-900 text-sm font-bold text-white">Y</div>
              <div className="min-w-0">
                <div className="truncate text-base font-bold text-slate-900">YouTube Channel Analyzer</div>
                <div className="hidden text-xs text-slate-500 sm:block">Enter a channel name to analyze</div>
              </div>
            </div>
            <div className="min-w-0">{form}</div>
            {authUser && (
              <div className="flex shrink-0 items-center justify-between gap-2 xl:justify-end">
                <div className="min-w-0 xl:text-right">
                  <div className="truncate text-sm font-medium text-slate-800">{authUser.displayName}</div>
                  <div className="hidden truncate text-xs text-slate-400 sm:block">{authUser.email}</div>
                  <div className="mt-1 hidden sm:block">
                    <ChannelUsageBadge usage={channelUsage} />
                    {authUser.isAdmin ? (
                      <span className="ml-1 inline-flex items-center rounded-full bg-violet-50 px-2 py-0.5 text-[11px] font-medium text-violet-700">
                        Admin · unlimited
                      </span>
                    ) : null}
                  </div>
                </div>
                <button
                  type="button"
                  onClick={handleLogout}
                  className="shrink-0 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-600 transition hover:border-slate-300 hover:text-slate-900"
                >
                  Sign out
                </button>
              </div>
            )}
          </div>
        </div>
      </header>

      <main className="app-container py-5 sm:py-6 lg:py-8">
        <FavoriteList
          className="mb-6"
          items={favorites}
          activeId={result ? result.channel.id : null}
          disabled={isInitialLoading}
          showEmpty={Boolean(API_BASE && authUser)}
          onOpen={openFavorite}
          onRemove={removeFavorite}
        />

        {isInitialLoading && <LoadingState message={statusMsg} />}

        {phase === "error" && error && (
          <div className="mb-6 rounded-2xl border border-rose-200 bg-rose-50 px-6 py-4 text-sm text-rose-600">
            {error}
          </div>
        )}

        {cacheWarning && (
          <div className="mb-6 rounded-2xl border border-amber-200 bg-amber-50 px-6 py-4 text-sm text-amber-800">
            {cacheWarning}
          </div>
        )}

        {!result && !isInitialLoading && (
          <div className="flex flex-col items-center justify-center rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-20 text-center">
            <div className="flex h-12 w-12 items-center justify-center rounded-2xl bg-slate-900 text-white">
              <IconFilm className="h-5 w-5" />
            </div>
            <h2 className="mt-4 text-base font-semibold text-slate-900">No results yet</h2>
            <p className="mt-1 max-w-sm text-sm text-slate-400">
              Type a channel handle or URL above, then hit Analyze to see the report here.
            </p>
          </div>
        )}

        {result && (
          <div className="space-y-6">
            {refreshing && (
              <div className="flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-600 shadow-sm">
                <Spinner className="h-4 w-4 shrink-0 text-slate-500" />
                <span>Updating channel data…</span>
                {statusMsg && statusMsg !== "Updating channel data…" && (
                  <span className="truncate text-slate-400">· {statusMsg}</span>
                )}
              </div>
            )}
            <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
              <div className="flex min-w-0 items-center gap-3">
                {result.channel.thumbnail && (
                  <img src={result.channel.thumbnail} alt="" className="h-12 w-12 shrink-0 rounded-full bg-slate-100" />
                )}
                <div className="min-w-0">
                  <div className="flex flex-wrap items-center gap-2">
                    <h1 className="text-xl font-bold text-slate-900 sm:text-2xl lg:text-3xl">
                      {result.channel.title}
                    </h1>
                    <a
                      href={"https://www.youtube.com/channel/" + result.channel.id}
                      target="_blank"
                      rel="noopener noreferrer"
                      title="Open channel on YouTube"
                      className="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-red-600 transition hover:bg-red-50"
                    >
                      <IconYoutube className="h-5 w-5" />
                    </a>
                  </div>
                  {result.lastAnalyzedAt && (
                    <p className="mt-0.5 flex flex-wrap items-center gap-1 text-xs text-slate-400">
                      <span>Last analyzed {formatLastAnalyzed(result.lastAnalyzedAt)}</span>
                      <InfoTip
                        text="When this channel's video data was last fetched or refreshed from YouTube."
                        placement="bottom"
                        label="Last analyzed"
                      />
                    </p>
                  )}
                </div>
              </div>
              <button
                type="button"
                onClick={toggleFavorite}
                className={"inline-flex w-full shrink-0 items-center justify-center gap-1.5 rounded-xl border px-3 py-2 text-sm font-semibold transition sm:w-auto " +
                  (favorites.some(function (f) { return f.id === result.channel.id; })
                    ? "border-amber-200 bg-amber-50 text-amber-600"
                    : "border-slate-200 bg-white text-slate-600 hover:border-slate-300")}
              >
                <IconStar filled={favorites.some(function (f) { return f.id === result.channel.id; })} className="h-4 w-4" />
                {favorites.some(function (f) { return f.id === result.channel.id; }) ? "Saved" : "Save"}
              </button>
            </div>
              <div className="grid grid-cols-2 items-stretch gap-3 sm:grid-cols-3 lg:grid-cols-5 xl:gap-4">
                <StatCard
                  icon={<IconUsers className="h-4 w-4" />}
                  label="Subscribers"
                  value={result.channel.subscriberCount !== null ? formatNumber(result.channel.subscriberCount) : "Hidden"}
                  note="public count"
                  hint="Public subscriber count from YouTube. Shows as Hidden if the channel hides subscriber numbers."
                />
                <StatCard
                  icon={<IconFilm className="h-4 w-4" />}
                  label="Videos uploaded"
                  value={result.channel.videoCount !== null ? formatNumber(result.channel.videoCount) : "—"}
                  note="all-time total"
                  hint="Total public videos on the channel, from YouTube's published channel statistics."
                />
                <StatCard
                  icon={<IconFilm className="h-4 w-4" />}
                  label="Long videos"
                  value={formatNumber(result.contentMix.long)}
                  note="all-time total"
                  hint="Videos longer than 60 seconds in the channel's analyzed upload history, excluding live streams."
                />
                <StatCard
                  icon={<IconScissors className="h-4 w-4" />}
                  label="Shorts uploaded"
                  value={formatNumber(result.contentMix.short)}
                  note="all-time total"
                  hint="Videos up to 60 seconds in the analyzed upload history, including YouTube Shorts."
                />
                <StatCard
                  icon={<IconCalendar className="h-4 w-4" />}
                  label="Channel age"
                  value={result.channel.publishedAt ? formatChannelAge(result.channel.publishedAt) : "—"}
                  note={result.channel.publishedAt ? "Started " + formatDate(result.channel.publishedAt) : "start date unknown"}
                  hint="How long ago the YouTube channel was created."
                />
              </div>

              <PublishingInsightsPanel
                insights={publishingInsights}
                range={activityRange}
                onRangeChange={setActivityRange}
              />

              <ContentPerformancePanel
                performance={contentPerformance}
                range={contentPerformanceRange}
                onRangeChange={setContentPerformanceRange}
              />

              <ContentTopicsPanel
                topics={contentTopics}
                range={contentTopicsRange}
                onRangeChange={setContentTopicsRange}
                channelId={result.channel.id}
                allVideos={result.classified}
                onClassificationsUpdated={refreshTopicClassifications}
                canUseGemini={!API_BASE || geminiTopicAnalysis}
              />

          </div>
        )}
      </main>
    </div>
  );

}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
