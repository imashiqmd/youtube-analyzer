const YOUTUBE_API_KEY = "AIzaSyB0-Wl3AsyNO3fZVyRo-K279cN7Qn8I6QM";
const GEMINI_API_KEY = "__GEMINI_API_KEY__";
const API_BASE = (function () {
  const configured = "__API_BASE_URL__";
  if (configured && !configured.startsWith("__")) return configured.replace(/\/$/, "");
  if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
    return "http://localhost:3001";
  }
  return "";
})();
const AUTH_TOKEN_LOCAL_KEY = "ytca-auth-token";
const AUTH_TOKEN_SESSION_KEY = "ytca-auth-token-session";
const AUTH_USER_CACHE_KEY = "ytca-auth-user";

function getStoredAuthToken() {
  return localStorage.getItem(AUTH_TOKEN_LOCAL_KEY) || sessionStorage.getItem(AUTH_TOKEN_SESSION_KEY) || "";
}

function storeAuthToken(token, rememberMe) {
  localStorage.removeItem(AUTH_TOKEN_LOCAL_KEY);
  sessionStorage.removeItem(AUTH_TOKEN_SESSION_KEY);
  if (!token) return;
  if (rememberMe) localStorage.setItem(AUTH_TOKEN_LOCAL_KEY, token);
  else sessionStorage.setItem(AUTH_TOKEN_SESSION_KEY, token);
}

function clearAuthToken() {
  localStorage.removeItem(AUTH_TOKEN_LOCAL_KEY);
  sessionStorage.removeItem(AUTH_TOKEN_SESSION_KEY);
  localStorage.removeItem(AUTH_USER_CACHE_KEY);
}

function loadCachedAuthUser() {
  try {
    const parsed = JSON.parse(localStorage.getItem(AUTH_USER_CACHE_KEY) || "null");
    return parsed && parsed.id ? parsed : null;
  } catch (e) {
    return null;
  }
}

function persistCachedAuthUser(user) {
  if (!user) return;
  try {
    localStorage.setItem(AUTH_USER_CACHE_KEY, JSON.stringify(user));
  } catch (e) { /* ignore */ }
}

async function apiRequest(path, options) {
  const opts = options || {};
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  const token = getStoredAuthToken();
  if (token) headers.Authorization = "Bearer " + token;
  if (!API_BASE) throw new Error("Sign-in is not available on this deployment.");
  const res = await fetch(API_BASE + path, {
    method: opts.method || "GET",
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(function () { return {}; });
  if (!res.ok) {
    const err = new Error(data.error || ("Request failed (" + res.status + ")"));
    if (data.code) err.code = data.code;
    throw err;
  }
  return data;
}

function formatApiError(err) {
  const msg = err && err.message ? err.message : String(err);
  if (msg === "Failed to fetch" || msg.indexOf("NetworkError") >= 0 || msg.indexOf("Load failed") >= 0) {
    return "Cannot reach the server. Make sure the backend API is running on " + API_BASE + ".";
  }
  return msg;
}

function apiResponseToCacheEntry(data) {
  return {
    version: CACHE_VERSION,
    channelId: data.channelId,
    lastAnalyzedAt: data.lastSyncedAt,
    lastSyncedAt: data.lastSyncedAt,
    channel: data.channel,
    videoIds: data.videoIds || (data.rawVideos || []).map(function (v) { return v.id; }),
    rawVideos: data.rawVideos || [],
    topicClassifications: data.topicClassifications || {},
  };
}

async function fetchTopicClassificationsFromApi(channelId) {
  if (!API_BASE || !getStoredAuthToken() || !channelId) return {};
  const data = await apiRequest("/channels/" + encodeURIComponent(channelId) + "/topic-classifications");
  return data.topicClassifications || {};
}

async function saveTopicClassificationsToApi(channelId, classifications) {
  if (!API_BASE || !getStoredAuthToken() || !channelId) return null;
  const payload = classifications || {};
  if (!Object.keys(payload).length) return null;
  const data = await apiRequest("/channels/" + encodeURIComponent(channelId) + "/topic-classifications", {
    method: "PUT",
    body: { classifications: payload },
  });
  return data.topicClassifications || null;
}

async function logGeminiUsageToApi(channelId, model, videosClassified) {
  if (!API_BASE || !getStoredAuthToken()) return;
  try {
    await apiRequest("/usage/gemini", {
      method: "POST",
      body: {
        channelId: channelId,
        model: model,
        videosClassified: videosClassified || 0,
      },
    });
  } catch (e) {
    console.warn("Could not log Gemini API usage:", e);
  }
}

async function applyTopicClassificationsToVideos(channelId, videos, topicMap) {
  if (!videos || !videos.length || !topicMap) return 0;
  let applied = 0;
  const mem = memoryChannelCache.get(channelId);
  if (mem && !mem.topicClassifications) mem.topicClassifications = {};

  for (let i = 0; i < videos.length; i++) {
    const video = videos[i];
    const videoId = video.id || video.videoId;
    if (!videoId) continue;
    const classification = topicMap[videoId];
    if (!isValidTopicClassification(classification)) continue;
    if (isValidTopicClassification(video.topicClassification)) continue;
    video.topicClassification = classification;
    if (mem) mem.topicClassifications[videoId] = classification;
    await saveVideoTopicClassification(channelId, videoId, classification, { skipApi: true });
    applied++;
  }
  return applied;
}

async function hydrateTopicClassificationsForEntry(entry) {
  if (!entry || !entry.channelId) return entry;

  let serverMap = entry.topicClassifications || {};
  if (API_BASE && getStoredAuthToken()) {
    try {
      const apiMap = await fetchTopicClassificationsFromApi(entry.channelId);
      serverMap = Object.assign({}, serverMap, apiMap);
    } catch (e) {
      console.warn("Could not load topic classifications from server:", e);
    }
  }

  try {
    const local = await loadChannelCache(entry.channelId);
    const localMap = (local && local.topicClassifications) ? local.topicClassifications : {};
    entry.topicClassifications = Object.assign({}, localMap, serverMap);
  } catch (e) {
    entry.topicClassifications = serverMap;
  }

  if (entry.rawVideos && entry.rawVideos.length && entry.topicClassifications) {
    entry.rawVideos.forEach(function (raw) {
      if (!raw || !raw.id) return;
      const classification = entry.topicClassifications[raw.id];
      if (isValidTopicClassification(classification)) {
        raw.topicClassification = classification;
      }
    });
  }

  memoryChannelCache.set(entry.channelId, entry);
  return entry;
}

async function mergeTopicClassificationsFromCache(entry) {
  entry = await hydrateTopicClassificationsForEntry(entry);

  if (API_BASE && getStoredAuthToken() && entry.channelId) {
    try {
      const local = await loadChannelCache(entry.channelId);
      const localMap = (local && local.topicClassifications) ? local.topicClassifications : {};
      const serverMap = entry.topicClassifications || {};
      const toUpload = {};
      Object.keys(localMap).forEach(function (videoId) {
        const localClass = localMap[videoId];
        if (isValidTopicClassification(localClass) && !isValidTopicClassification(serverMap[videoId])) {
          toUpload[videoId] = localClass;
        }
      });
      if (Object.keys(toUpload).length) {
        const merged = await saveTopicClassificationsToApi(entry.channelId, toUpload);
        if (merged) {
          entry.topicClassifications = Object.assign({}, entry.topicClassifications || {}, merged);
          await hydrateTopicClassificationsForEntry(entry);
        }
      }
    } catch (e) { /* keep merged entry */ }
  }

  return entry;
}

async function analyzeChannelViaApi(handle, onProgress, options) {
  const opts = options || {};
  if (opts.channelId) {
    if (onProgress) onProgress("Loading saved channel…");
    try {
      const data = await apiRequest("/channels/" + encodeURIComponent(opts.channelId));
      if (onProgress) onProgress("Loaded from saved data…");
      return { entry: apiResponseToCacheEntry(data), usage: data.usage || null };
    } catch (e) {
      if (e && e.message && e.message.indexOf("not found") < 0) throw e;
    }
  }
  if (onProgress) onProgress("Checking shared database cache…");
  const data = await apiRequest("/analyze", { method: "POST", body: { handle: handle } });
  if (onProgress) {
    onProgress(data.source === "cache"
      ? "Loaded from saved data…"
      : "Fetching channel data…");
  }
  return {
    entry: apiResponseToCacheEntry(data),
    usage: data.usage || null,
  };
}

async function fetchSavedChannelsFromApi() {
  const data = await apiRequest("/me/saved-channels");
  return data.channels || [];
}

function channelSavePayload(channel) {
  const id = channel.id || channel.channelId;
  const query = channel.query
    || (channel.customUrl ? "https://www.youtube.com/" + channel.customUrl.replace(/^\//, "") : null)
    || ("https://www.youtube.com/channel/" + id);
  return {
    id: id,
    title: channel.title || "Saved channel",
    thumbnail: channel.thumbnail || "",
    query: query,
  };
}

async function saveChannelToApi(channel) {
  const payload = channelSavePayload(channel);
  const data = await apiRequest("/me/saved-channels", {
    method: "POST",
    body: {
      channelId: payload.id,
      title: payload.title,
      thumbnail: payload.thumbnail,
      query: payload.query,
    },
  });
  return data.channels || [];
}

async function migrateLocalFavoritesToApi(existingChannels) {
  if (!API_BASE || !getStoredAuthToken()) return existingChannels || [];
  const local = loadFavorites();
  if (!local.length) return existingChannels || [];

  let channels = existingChannels || [];
  const existingIds = {};
  channels.forEach(function (c) { existingIds[c.id] = true; });

  for (let i = 0; i < local.length; i++) {
    const fav = local[i];
    if (!fav || !fav.id || existingIds[fav.id]) continue;
    try {
      channels = await saveChannelToApi(fav);
      existingIds[fav.id] = true;
    } catch (e) {
      console.warn("Could not migrate saved channel:", fav.id, e);
    }
  }

  if (channels.length) {
    try { localStorage.removeItem(FAVORITES_KEY); } catch (e) { /* ignore */ }
  }
  return channels;
}

async function removeChannelFromApi(channelId) {
  const data = await apiRequest("/me/saved-channels/" + encodeURIComponent(channelId), {

function getGeminiApiKey() {

function requireGeminiApiKey() {

  "gemini-flash-lite-latest",

  "gemini-flash-latest",
];
const GEMINI_BATCH_SIZE = 8;

const GEMINI_RETRY_DELAYS_MS = [2000, 5000, 12000];
const TOPIC_CLASSIFICATION_VERSION = 1;
const TOPIC_OTHER_MAX_SHARE = 0.2;
const MAX_PLAYLIST_PAGES = null; // null = fetch entire upload history
const FAVORITES_KEY = "ytca-favorites";
const SAVED_CHANNELS_CACHE_KEY = "ytca-saved-channels-cache";
const CHANNEL_SYNC_KEY = "ytca-channel-sync";
const CHANNEL_DB_NAME = "ytca-channel-db";
const CHANNEL_DB_VERSION = 2;
const CHANNEL_STORE = "channels";
const VIDEO_STORE = "videos";
const CACHE_VERSION = 2;
const memoryChannelCache = new Map();
const ACTIVITY_PERIODS = [
  { label: "1 week", days: 7 },
  { label: "1 month", days: 30 },
  { label: "3 months", days: 91 },
  { label: "6 months", days: 182 },
  { label: "1 year", days: 365 },
];

function pad2(n) {
  return n < 10 ? "0" + n : String(n);
}

function toInputDate(d) {

  return dt.getFullYear() + "-" + pad2(dt.getMonth() + 1) + "-" + pad2(dt.getDate());

function loadFavorites() {
  try {
    const parsed = JSON.parse(localStorage.getItem(FAVORITES_KEY) || "[]");

}

function persistFavorites(list) {

function loadSavedChannelsCache() {
  try {
    const parsed = JSON.parse(localStorage.getItem(SAVED_CHANNELS_CACHE_KEY) || "[]");

}

function persistSavedChannelsCache(channels) {

function applyFavoritesUpdate(setFavorites, channels) {

function loadChannelSyncStore() {
  try {
    const parsed = JSON.parse(localStorage.getItem(CHANNEL_SYNC_KEY) || "{}");
    return parsed && typeof parsed === "object" ? parsed : {};
  } catch (e) {
    return {};
  }
}

function loadChannelSyncMeta(channelId) {
  if (!channelId) return null;
  return loadChannelSyncStore()[channelId] || null;
}

function saveChannelSyncMeta(channelId, lastSyncedAt) {
  const store = loadChannelSyncStore();
  store[channelId] = { channelId: channelId, lastSyncedAt: lastSyncedAt };
  try {
    localStorage.setItem(CHANNEL_SYNC_KEY, JSON.stringify(store));
  } catch (e) {
    if (isQuotaError(e)) {
      throw new ChannelCacheError(
        "Browser storage is full. Could not save sync metadata. Free up space and try again.",
        "QUOTA_EXCEEDED"
      );
    }
    throw e;
  }
}

function ChannelCacheError(message, code) {
  this.name = "ChannelCacheError";
  this.message = message;
  this.code = code || "CACHE_ERROR";
}
ChannelCacheError.prototype = Object.create(Error.prototype);
ChannelCacheError.prototype.constructor = ChannelCacheError;

function isQuotaError(err) {
  if (!err) return false;
  return err.name === "QuotaExceededError" || err.code === 22 || err.code === 1014;
}

function wrapIdbError(err, context) {
  if (isQuotaError(err)) {
    return new ChannelCacheError(
      "Browser storage is full. " + context + " Free up disk space or clear cached channel data.",
      "QUOTA_EXCEEDED"
    );
  }
  return err;
}

function videoRecordKey(channelId, videoId) {
  return channelId + "::" + videoId;
}

function idbRequest(req) {
  return new Promise(function (resolve, reject) {
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}

function waitTransaction(tx) {
  return new Promise(function (resolve, reject) {
    tx.oncomplete = function () { resolve(); };
    tx.onerror = function () { reject(tx.error); };
    tx.onabort = function () { reject(tx.error || new Error("Transaction aborted")); };
  });
}

function openChannelCacheDb() {
  return new Promise(function (resolve, reject) {
    if (!window.indexedDB) {
      reject(new ChannelCacheError("IndexedDB is not available in this browser.", "IDB_UNAVAILABLE"));
      return;
    }
    const req = indexedDB.open(CHANNEL_DB_NAME, CHANNEL_DB_VERSION);
    req.onerror = function () { reject(wrapIdbError(req.error, "Could not open cache database.")); };
    req.onsuccess = function () { resolve(req.result); };
    req.onupgradeneeded = function (e) {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(CHANNEL_STORE)) {
        db.createObjectStore(CHANNEL_STORE, { keyPath: "channelId" });
      }
      if (!db.objectStoreNames.contains(VIDEO_STORE)) {
        const videoStore = db.createObjectStore(VIDEO_STORE, { keyPath: "id" });
        videoStore.createIndex("byChannelId", "channelId", { unique: false });
      }
    };
  });
}

function compactRawVideo(video) {
  if (!video) return null;
  const snippet = video.snippet || {};
  return {
    id: video.id,
    snippet: {
      title: snippet.title,
      publishedAt: snippet.publishedAt,
      description: snippet.description || "",
      tags: Array.isArray(snippet.tags) ? snippet.tags : [],
    },
    contentDetails: video.contentDetails,
    statistics: video.statistics,
    liveStreamingDetails: video.liveStreamingDetails || undefined,
  };
}

function isValidCacheEntry(entry) {
  return !!(entry && entry.version === CACHE_VERSION && Array.isArray(entry.rawVideos) && entry.rawVideos.length);
}

function assembleCacheEntry(channelMeta, videoRecords) {
  if (!channelMeta || channelMeta.version !== CACHE_VERSION) return null;
  const videoMap = {};
  const topicClassifications = Object.assign({}, channelMeta.topicClassifications || {});
  (videoRecords || []).forEach(function (record) {
    if (record && record.videoId && record.raw) videoMap[record.videoId] = record.raw;
    if (record && record.videoId && record.topicClassification) {
      topicClassifications[record.videoId] = record.topicClassification;
    }
  });
  const videoIds = channelMeta.videoIds || [];
  const rawVideos = videoIds.map(function (vid) { return videoMap[vid]; }).filter(Boolean);
  if (!rawVideos.length) return null;
  return {
    version: CACHE_VERSION,
    channelId: channelMeta.channelId,
    lastAnalyzedAt: channelMeta.lastSyncedAt,
    lastSyncedAt: channelMeta.lastSyncedAt,
    channel: channelMeta.channel,
    videoIds: videoIds,
    rawVideos: rawVideos,
    topicClassifications: topicClassifications,
  };
}

function toChannelMeta(entry) {
  const lastSyncedAt = entry.lastSyncedAt || entry.lastAnalyzedAt || new Date().toISOString();
  return {
    channelId: entry.channelId,
    version: CACHE_VERSION,
    channel: entry.channel,
    videoIds: entry.videoIds || entry.rawVideos.map(function (v) { return v.id; }),
    lastSyncedAt: lastSyncedAt,
    topicClassifications: entry.topicClassifications || {},
  };
}

function loadChannelCacheSync(channelId) {
  if (!channelId) return null;
  const mem = memoryChannelCache.get(channelId);
  return mem && isValidCacheEntry(mem) ? mem : null;
}

async function loadChannelMeta(channelId) {
  const db = await openChannelCacheDb();
  return idbRequest(db.transaction(CHANNEL_STORE, "readonly").objectStore(CHANNEL_STORE).get(channelId));
}

async function loadChannelVideoRecords(channelId) {
  const db = await openChannelCacheDb();
  const index = db.transaction(VIDEO_STORE, "readonly").objectStore(VIDEO_STORE).index("byChannelId");
  return idbRequest(index.getAll(channelId));
}

async function loadChannelCache(channelId) {
  const sync = loadChannelCacheSync(channelId);
  if (sync) return sync;
  if (!channelId) return null;

  try {
    const channelMeta = await loadChannelMeta(channelId);
    if (!channelMeta || channelMeta.version !== CACHE_VERSION) return null;
    const videoRecords = await loadChannelVideoRecords(channelId);
    const entry = assembleCacheEntry(channelMeta, videoRecords);
    if (entry) memoryChannelCache.set(channelId, entry);
    return entry;
  } catch (e) {
    throw wrapIdbError(e, "Could not load cached channel data.");
  }
}

async function putVideoRecords(store, channelId, rawVideos, existingByVideoId, topicClassifications) {
  const existingMap = existingByVideoId || {};
  const topicMap = topicClassifications || {};
  for (let i = 0; i < rawVideos.length; i++) {
    const raw = compactRawVideo(rawVideos[i]);
    if (!raw || !raw.id) continue;
    const key = videoRecordKey(channelId, raw.id);
    const record = {
      id: key,
      channelId: channelId,
      videoId: raw.id,
      raw: raw,
    };
    const existing = existingMap[raw.id];
    if (existing && existing.topicClassification) {
      record.topicClassification = existing.topicClassification;
    }
    if (isValidTopicClassification(topicMap[raw.id])) {
      record.topicClassification = topicMap[raw.id];
    }
    await idbRequest(store.put(record));
  }
}

async function saveChannelVideos(channelId, rawVideos, topicClassifications) {
  if (!rawVideos || !rawVideos.length) return;
  const db = await openChannelCacheDb();
  const tx = db.transaction(VIDEO_STORE, "readwrite");
  const store = tx.objectStore(VIDEO_STORE);
  const index = store.index("byChannelId");
  const existingRecords = await idbRequest(index.getAll(channelId));
  const existingByVideoId = {};
  (existingRecords || []).forEach(function (record) {
    if (record && record.videoId) existingByVideoId[record.videoId] = record;
  });
  await putVideoRecords(store, channelId, rawVideos, existingByVideoId, topicClassifications);
  await waitTransaction(tx);
}

async function saveVideoTopicClassification(channelId, videoId, classification, options) {
  const opts = options || {};
  const db = await openChannelCacheDb();
  const key = videoRecordKey(channelId, videoId);
  const tx = db.transaction(VIDEO_STORE, "readwrite");
  const store = tx.objectStore(VIDEO_STORE);
  const existing = await idbRequest(store.get(key));
  if (!existing) {
    const mem = memoryChannelCache.get(channelId);
    if (mem) {
      if (!mem.topicClassifications) mem.topicClassifications = {};
      mem.topicClassifications[videoId] = classification;
    }
    await waitTransaction(tx);
    return false;
  }
  existing.topicClassification = classification;
  await idbRequest(store.put(existing));
  await waitTransaction(tx);
  const mem = memoryChannelCache.get(channelId);
  if (mem) {
    if (!mem.topicClassifications) mem.topicClassifications = {};
    mem.topicClassifications[videoId] = classification;
  }
  return true;
}

async function saveChannelMeta(channelMeta) {
  const db = await openChannelCacheDb();
  const tx = db.transaction(CHANNEL_STORE, "readwrite");
  try {
    await idbRequest(tx.objectStore(CHANNEL_STORE).put(channelMeta));
    await waitTransaction(tx);
    saveChannelSyncMeta(channelMeta.channelId, channelMeta.lastSyncedAt);
  } catch (e) {
    if (e instanceof ChannelCacheError) throw e;
    throw wrapIdbError(e, "Could not save channel metadata.");
  }
}

async function saveChannelCache(entry) {
  const normalized = {
    version: CACHE_VERSION,
    channelId: entry.channelId,
    lastAnalyzedAt: entry.lastAnalyzedAt || entry.lastSyncedAt || new Date().toISOString(),
    lastSyncedAt: entry.lastSyncedAt || entry.lastAnalyzedAt || new Date().toISOString(),
    channel: entry.channel,
    videoIds: entry.videoIds || (entry.rawVideos || []).map(function (v) { return v.id; }),
    rawVideos: (entry.rawVideos || []).map(compactRawVideo).filter(Boolean),
  };
  if (!isValidCacheEntry(normalized)) {
    throw new ChannelCacheError("Invalid channel data — nothing to cache.", "INVALID_CACHE");
  }

  const channelMeta = toChannelMeta(normalized);
  await saveChannelMeta(channelMeta);
  await saveChannelVideos(normalized.channelId, normalized.rawVideos, entry.topicClassifications);
  memoryChannelCache.set(normalized.channelId, Object.assign({}, normalized, {
    topicClassifications: entry.topicClassifications || {},
  }));
  return Object.assign({}, normalized, { topicClassifications: entry.topicClassifications || {} });
}

async function appendChannelVideos(channelId, channelMeta, newRawVideos) {
  if (newRawVideos && newRawVideos.length) {
    await saveChannelVideos(channelId, newRawVideos);
  }
  await saveChannelMeta(channelMeta);
  const entry = await loadChannelCache(channelId);
  if (!entry) {
    throw new ChannelCacheError("Cached channel data could not be reloaded after update.", "RELOAD_FAILED");
  }
  return entry;
}

async function migrateLegacyMonolithicEntry(entry) {
  const normalized = {
    version: CACHE_VERSION,
    channelId: entry.channelId,
    lastAnalyzedAt: entry.lastAnalyzedAt || entry.lastSyncedAt,
    lastSyncedAt: entry.lastSyncedAt || entry.lastAnalyzedAt || new Date().toISOString(),
    channel: entry.channel,
    videoIds: entry.videoIds || (entry.rawVideos || []).map(function (v) { return v.id; }),
    rawVideos: entry.rawVideos || [],
  };
  if (!normalized.channelId || !normalized.rawVideos.length) return;
  await saveChannelCache(normalized);
}

async function migrateLegacyChannelCache() {
  try {
    const legacyKey = "ytca-channel-cache";
    const legacyStore = JSON.parse(localStorage.getItem(legacyKey) || "{}");
    const legacyIds = Object.keys(legacyStore);
    for (let i = 0; i < legacyIds.length; i++) {
      await migrateLegacyMonolithicEntry(legacyStore[legacyIds[i]]);
    }
    if (legacyIds.length) localStorage.removeItem(legacyKey);
  } catch (e) {
    console.warn("Legacy localStorage cache migration failed:", e);
  }

  try {
    const db = await openChannelCacheDb();
    const tx = db.transaction(CHANNEL_STORE, "readonly");
    const all = await idbRequest(tx.objectStore(CHANNEL_STORE).getAll());
    for (let i = 0; i < all.length; i++) {
      const row = all[i];
      if (row && Array.isArray(row.rawVideos) && row.rawVideos.length) {
        await migrateLegacyMonolithicEntry(row);
        const cleanupTx = db.transaction(CHANNEL_STORE, "readwrite");
        const meta = toChannelMeta({
          channelId: row.channelId,
          channel: row.channel,
          videoIds: row.videoIds || row.rawVideos.map(function (v) { return v.id; }),
          lastSyncedAt: row.lastSyncedAt || row.lastAnalyzedAt,
          rawVideos: row.rawVideos,
        });
        await idbRequest(cleanupTx.objectStore(CHANNEL_STORE).put(meta));
        await waitTransaction(cleanupTx);
      }
    }
  } catch (e) {
    console.warn("Legacy IndexedDB cache migration failed:", e);
  }
}

function isCacheFresh(entry) {
  return !!(entry && (entry.lastSyncedAt || entry.lastAnalyzedAt));
}

function buildResultFromCache(entry) {
  const topicClassifications = entry.topicClassifications || {};
  const classified = entry.rawVideos.map(function (v) {
    return classifyVideo(v, topicClassifications[v.id] || null);
  });
  return {
    channel: entry.channel,
    totalFetched: entry.rawVideos.length,
    contentMix: computeContentMix(classified),
    classified: classified,
    lastAnalyzedAt: entry.lastAnalyzedAt || entry.lastSyncedAt,
  };
}

function buildCacheEntry(channel, rawVideos, videoIds) {
  const lastSyncedAt = new Date().toISOString();
  return {
    version: CACHE_VERSION,
    channelId: channel.id,
    lastAnalyzedAt: lastSyncedAt,
    lastSyncedAt: lastSyncedAt,
    channel: channel,
    videoIds: videoIds,
    rawVideos: rawVideos,
  };
}

function formatLastAnalyzed(iso) {
  if (!iso) return "";
  const then = new Date(iso);
  const now = new Date();
  const diffMs = now - then;
  const diffMin = Math.floor(diffMs / 60000);
  if (diffMin < 1) return "just now";
  if (diffMin < 60) return diffMin + (diffMin === 1 ? " minute ago" : " minutes ago");
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return diffHr + (diffHr === 1 ? " hour ago" : " hours ago");
  const diffDay = Math.floor(diffHr / 24);
  if (diffDay < 7) return diffDay + (diffDay === 1 ? " day ago" : " days ago");
  return formatDate(iso);
}

function channelIdFromInput(raw) {
  const attempts = parseChannelInput(raw);
  if (!attempts) return null;
  const idAttempt = attempts.find(function (a) { return a.param === "id"; });
  return idAttempt ? idAttempt.value : null;
}

// ---------- plain-JS helpers (no LLM, no search.list) ----------

function parseDurationSeconds(iso) {
  const m = (iso || "").match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!m) return 0;
  const h = parseInt(m[1] || 0, 10);
  const mnt = parseInt(m[2] || 0, 10);
  const s = parseInt(m[3] || 0, 10);
  return h * 3600 + mnt * 60 + s;
}

function formatNumber(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  const num = Number(n);
  if (num >= 1000000) return (num / 1000000).toFixed(num >= 10000000 ? 0 : 1) + "M";
  if (num >= 1000) return (num / 1000).toFixed(num >= 10000 ? 0 : 1) + "K";
  if (num >= 100) return String(Math.round(num));
  if (num >= 1) return parseFloat(num.toFixed(1)).toString();
  if (num > 0) return parseFloat(num.toFixed(2)).toString();
  return "0";
}

function formatPercent(n, decimals) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  const d = decimals === undefined ? 1 : decimals;
  return parseFloat(Number(n).toFixed(d)).toString() + "%";
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("en-IN", { timeZone: DISPLAY_TIMEZONE, year: "numeric", month: "short", day: "numeric" });
}

function formatChannelAge(iso) {
  if (!iso) return "—";
  const start = new Date(iso);
  const now = new Date();
  let months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
  if (now.getDate() < start.getDate()) months--;
  if (months < 1) return "< 1 month old";
  if (months < 12) return months + (months === 1 ? " month old" : " months old");
  const years = Math.floor(months / 12);
  return years + (years === 1 ? " year old" : " years old");
}

function rangeWindowDays(range) {
  if (range.type === "preset") return range.days;
  const start = new Date(range.start + "T00:00:00+05:30");
  const end = new Date(range.end + "T23:59:59+05:30");
  return Math.max(1, Math.round((end - start) / 86400000) + 1);
}

function getRangeBounds(range) {
  if (range.type === "preset") {
    const endKey = localDateKey(new Date());
    const end = new Date(endKey + "T23:59:59+05:30");
    const startCal = parseInputDate(endKey);
    startCal.setDate(startCal.getDate() - (range.days - 1));
    const start = new Date(toInputDate(startCal) + "T00:00:00+05:30");
    return { start: start, end: end };
  }
  return {
    start: new Date(range.start + "T00:00:00+05:30"),
    end: new Date(range.end + "T23:59:59+05:30"),
  };
}

function getPreviousRangeBounds(range) {
  const bounds = getRangeBounds(range);
  const spanMs = bounds.end.getTime() - bounds.start.getTime();
  const prevEnd = new Date(bounds.start.getTime() - 1);
  const prevStart = new Date(prevEnd.getTime() - spanMs);
  return { start: prevStart, end: prevEnd };
}

function filterByDateRange(items, range) {
  const bounds = getRangeBounds(range);
  return filterByBounds(items, bounds.start, bounds.end);
}

function filterByBounds(items, start, end) {
  return items.filter(function (it) {
    const t = new Date(it.publishedAt);
    return t >= start && t <= end;
  });
}

function parseChannelInput(raw) {
  const input = (raw || "").trim();
  if (!input) return null;

  let url = null;
  try {
    url = new URL(/^https?:\/\//i.test(input) ? input : "https://" + input);
  } catch (e) {
    url = null;
  }

  if (url && /(^|\.)youtube\.com$/.test(url.hostname.replace(/^www\./, ""))) {
    const path = url.pathname.replace(/\/+$/, "");
    let m;
    if ((m = path.match(/^\/channel\/(UC[\w-]{20,})/))) {
      return [{ param: "id", value: m[1] }];
    }
    if ((m = path.match(/^\/@([^/]+)/))) {
      return [{ param: "forHandle", value: "@" + m[1] }];
    }
    if ((m = path.match(/^\/c\/([^/]+)/))) {
      return [
        { param: "forHandle", value: "@" + m[1] },
        { param: "forUsername", value: m[1] },
      ];
    }
    if ((m = path.match(/^\/user\/([^/]+)/))) {
      return [
        { param: "forUsername", value: m[1] },
        { param: "forHandle", value: "@" + m[1] },
      ];
    }
    const seg = path.split("/").filter(Boolean).pop();
    if (seg) return [{ param: "forHandle", value: "@" + seg.replace(/^@/, "") }];
  }

  if (/^UC[\w-]{20,}$/.test(input)) {
    return [{ param: "id", value: input }];
  }

  const handle = input.replace(/^@/, "");
  return [
    { param: "forHandle", value: "@" + handle },
    { param: "forUsername", value: handle.replace(/\s+/g, "") },
  ];
}

async function apiGet(endpoint, params, apiKey) {
  const url = new URL("https://www.googleapis.com/youtube/v3/" + endpoint);
  Object.keys(params).forEach(function (k) { url.searchParams.set(k, params[k]); });
  url.searchParams.set("key", apiKey);
  const res = await fetch(url.toString());
  const data = await res.json();
  if (!res.ok) {
    const msg = (data && data.error && data.error.message) || ("Request failed (" + res.status + ")");
    throw new Error(msg);
  }
  return data;
}

async function resolveChannel(apiKey, attempts) {
  for (let i = 0; i < attempts.length; i++) {
    const attempt = attempts[i];
    const params = { part: "snippet,statistics,contentDetails" };
    params[attempt.param] = attempt.value;
    const data = await apiGet("channels", params, apiKey);
    if (data.items && data.items.length) {
      const item = data.items[0];
      const thumbs = item.snippet.thumbnails || {};
      return {
        id: item.id,
        title: item.snippet.title,
        thumbnail: (thumbs.default && thumbs.default.url) || (thumbs.medium && thumbs.medium.url) || "",
        subscriberCount: (item.statistics && !item.statistics.hiddenSubscriberCount)
          ? Number(item.statistics.subscriberCount) : null,
        videoCount: item.statistics && item.statistics.videoCount !== undefined
          ? Number(item.statistics.videoCount) : null,
        publishedAt: item.snippet.publishedAt || null,
        uploadsPlaylistId: item.contentDetails.relatedPlaylists.uploads,
      };
    }
  }
  throw new Error("Couldn't find that channel. Try the exact @handle or the full channel URL (search.list isn't used, so fuzzy names may not resolve).");
}

async function resolveChannelById(apiKey, channelId) {
  return resolveChannel(apiKey, [{ param: "id", value: channelId }]);
}

async function fetchNewPlaylistItems(apiKey, playlistId, knownVideoIds, onProgress) {
  const knownSet = new Set(knownVideoIds);
  const newItems = [];
  let pageToken = undefined;
  let page = 0;
  do {
    const params = { part: "contentDetails", playlistId: playlistId, maxResults: 50 };
    if (pageToken) params.pageToken = pageToken;
    const data = await apiGet("playlistItems", params, apiKey);
    const batch = data.items || [];
    let hitKnown = false;
    for (let i = 0; i < batch.length; i++) {
      const videoId = batch[i].contentDetails && batch[i].contentDetails.videoId;
      if (!videoId) continue;
      if (knownSet.has(videoId)) {
        hitKnown = true;
        break;
      }
      newItems.push({ videoId: videoId });
    }
    page++;
    if (onProgress) onProgress(page, newItems.length);
    if (hitKnown) break;
    pageToken = data.nextPageToken;
  } while (pageToken);
  return newItems;
}

async function fetchAllPlaylistItems(apiKey, playlistId, onProgress, maxPages) {
  let items = [];
  let pageToken = undefined;
  let page = 0;
  do {
    const params = { part: "contentDetails", playlistId: playlistId, maxResults: 50 };
    if (pageToken) params.pageToken = pageToken;
    const data = await apiGet("playlistItems", params, apiKey);
    items = items.concat(data.items || []);
    pageToken = data.nextPageToken;
    page++;
    if (onProgress) onProgress(page, items.length);
  } while (pageToken && (maxPages == null || page < maxPages));
  return items
    .map(function (it) { return { videoId: it.contentDetails.videoId }; })
    .filter(function (it) { return !!it.videoId; });
}

async function fetchVideosDetails(apiKey, videoIds, onProgress) {
  const chunks = [];
  for (let i = 0; i < videoIds.length; i += 50) chunks.push(videoIds.slice(i, i + 50));
  let results = [];
  for (let i = 0; i < chunks.length; i++) {
    const data = await apiGet("videos", { part: "snippet,contentDetails,liveStreamingDetails,statistics", id: chunks[i].join(",") }, apiKey);
    results = results.concat(data.items || []);
    if (onProgress) onProgress(i + 1, chunks.length);
  }
  return results;
}

async function fetchFullChannelData(apiKey, channel, onProgress) {
  onProgress("Fetching full upload history…");
  const playlistItems = await fetchAllPlaylistItems(apiKey, channel.uploadsPlaylistId, function (page, count) {
    onProgress("Fetching upload history… (page " + page + ", " + count + " videos so far)");
  });
  const videoIds = playlistItems.map(function (p) { return p.videoId; });
  if (!videoIds.length) throw new Error("This channel has no public uploads.");

  onProgress("Fetching details for " + videoIds.length + " videos…");
  const rawVideos = await fetchVideosDetails(apiKey, videoIds, function (done, total) {
    onProgress("Fetching video details… (batch " + done + "/" + total + ")");
  });

  return buildCacheEntry(channel, rawVideos, videoIds);
}

async function refreshChannelCache(apiKey, cacheEntry, onProgress) {
  onProgress("Updating channel info…");
  const channel = await resolveChannelById(apiKey, cacheEntry.channelId);

  const knownIds = cacheEntry.videoIds || cacheEntry.rawVideos.map(function (v) { return v.id; });
  onProgress("Checking for new uploads…");
  const newPlaylistItems = await fetchNewPlaylistItems(apiKey, channel.uploadsPlaylistId, knownIds, function (page, count) {
    onProgress("Checking for new uploads… (" + count + " new so far)");
  });

  const lastSyncedAt = new Date().toISOString();
  let videoIds = knownIds.slice();
  let newRawVideos = [];

  if (newPlaylistItems.length) {
    const newIds = newPlaylistItems.map(function (p) { return p.videoId; });
    onProgress("Fetching details for " + newIds.length + " new videos…");
    newRawVideos = await fetchVideosDetails(apiKey, newIds, function (done, total) {
      onProgress("Fetching new video details… (batch " + done + "/" + total + ")");
    });
    videoIds = newIds.concat(videoIds);
  }

  const channelMeta = {
    channelId: channel.id,
    version: CACHE_VERSION,
    channel: channel,
    videoIds: videoIds,
    lastSyncedAt: lastSyncedAt,
  };

  return appendChannelVideos(channel.id, channelMeta, newRawVideos);
}

// ---------- channel publishing behavior (plain JS) ----------

function classifyVideo(v, topicClassification) {
  const durationSec = parseDurationSeconds(v.contentDetails.duration);
  const isLive = !!(v.liveStreamingDetails && v.liveStreamingDetails.actualStartTime);
  const category = isLive ? "live" : (durationSec <= 60 ? "short" : "long");
  const stats = v.statistics || {};
  const snippet = v.snippet || {};
  return {
    id: v.id,
    title: snippet.title || "Untitled",
    publishedAt: snippet.publishedAt,
    description: snippet.description || "",
    tags: Array.isArray(snippet.tags) ? snippet.tags : [],
    transcript: snippet.transcript || "",
    durationSec: durationSec,
    category: category,
    viewCount: Number(stats.viewCount) || 0,
    likeCount: Number(stats.likeCount) || 0,
    commentCount: Number(stats.commentCount) || 0,
    topicClassification: topicClassification || null,
  };
}

function computeCadenceForRange(items, windowDays) {
  if (!items.length) return null;
  const sorted = items.slice().sort(function (a, b) { return new Date(a.publishedAt) - new Date(b.publishedAt); });
  const weeks = windowDays / 7;
  const months = windowDays / 30.44;
  return {
    count: items.length,
    lastDate: sorted[sorted.length - 1].publishedAt,
    perWeek: items.length / weeks,
    perMonth: items.length / months,
  };
}

function computePublishingActivityFromFiltered(filtered, windowDays) {
  const longItems = filtered.filter(function (it) { return it.category === "long"; });
  const shortItems = filtered.filter(function (it) { return it.category === "short"; });
  const liveItems = filtered.filter(function (it) { return it.category === "live"; });
  const mix = computeContentMix(filtered);
  return {
    longCadence: computeCadenceForRange(longItems, windowDays),
    shortCadence: computeCadenceForRange(shortItems, windowDays),
    liveCadence: computeCadenceForRange(liveItems, windowDays),
    mostActiveDay: computeMostActiveDay(filtered),
    longAverageGap: computeAverageGap(longItems),
    shortAverageGap: computeAverageGap(shortItems),
    liveAverageGap: computeAverageGap(liveItems),
    formatMix: formatMixSplit(mix),
    totalInPeriod: filtered.length,
    longCount: longItems.length,
    shortCount: shortItems.length,
    liveCount: liveItems.length,
  };
}

function computePublishingActivity(classified, range) {
  const filtered = filterByDateRange(classified, range);
  return computePublishingActivityFromFiltered(filtered, rangeWindowDays(range));
}

function startOfLocalDay(d) {
  return parseInputDate(localDateKey(d));
}

function localDateKey(d) {
  const parts = {};
  new Intl.DateTimeFormat("en-IN", {
    timeZone: DISPLAY_TIMEZONE,
    year: "numeric",
    month: "numeric",
    day: "numeric",
  }).formatToParts(new Date(d)).forEach(function (p) {
    if (p.type !== "literal") parts[p.type] = parseInt(p.value, 10);
  });
  return parts.year + "-" + pad2(parts.month) + "-" + pad2(parts.day);
}

function parseInputDate(key) {
  const p = key.split("-");
  return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
}

function formatDayLabels(key) {
  const dt = new Date(key + "T12:00:00+05:30");
  return {
    label: dt.toLocaleDateString("en-IN", { timeZone: DISPLAY_TIMEZONE, weekday: "long", month: "short", day: "numeric" }),
    shortLabel: dt.toLocaleDateString("en-IN", { timeZone: DISPLAY_TIMEZONE, weekday: "short" }),
    dayNum: parseInt(key.split("-")[2], 10),
  };
}

function monthBucketKey(iso) {
  return localDateKey(iso).slice(0, 7);
}

function enumerateMonthsInRange(start, end) {
  const months = [];
  let y = start.getFullYear();
  let m = start.getMonth();
  const endY = end.getFullYear();
  const endM = end.getMonth();
  while (y < endY || (y === endY && m <= endM)) {
    const labelDate = new Date(y, m, 1);
    months.push({
      key: y + "-" + pad2(m + 1),
      label: labelDate.toLocaleDateString("en-IN", { timeZone: DISPLAY_TIMEZONE, month: "long", year: "numeric" }),
      shortLabel: labelDate.toLocaleDateString("en-IN", { timeZone: DISPLAY_TIMEZONE, month: "short" }),
    });
    m++;
    if (m > 11) { m = 0; y++; }
  }
  return months;
}

function enumerateDaysInRange(start, end) {
  const days = [];
  const cur = startOfLocalDay(start);
  const endDay = startOfLocalDay(end);
  while (cur <= endDay) {
    const key = toInputDate(cur);
    const labels = formatDayLabels(key);
    days.push({
      key: key,
      label: labels.label,
      shortLabel: labels.shortLabel,
      dayNum: labels.dayNum,
    });
    cur.setDate(cur.getDate() + 1);
  }
  return days;
}

function dayBucketKey(iso) {
  return localDateKey(iso);
}

function isPublishingCategory(category) {
  return category === "long" || category === "short" || category === "live";
}

function emptyTrendCounts() {
  return { long: 0, short: 0, live: 0 };
}

function trendBucketTotal(counts) {
  return counts.long + counts.short + counts.live;
}

function computeDailyUploadTrend(classified, range) {
  const bounds = getRangeBounds(range);
  const filtered = filterByBounds(classified, bounds.start, bounds.end);
  const days = enumerateDaysInRange(bounds.start, bounds.end);
  const counts = {};
  days.forEach(function (d) { counts[d.key] = emptyTrendCounts(); });
  filtered.forEach(function (it) {
    if (!isPublishingCategory(it.category)) return;
    const key = dayBucketKey(it.publishedAt);
    if (!counts[key]) return;
    counts[key][it.category]++;
  });
  return days.map(function (d) {
    const c = counts[d.key];
    return {
      key: d.key,
      label: d.label,
      shortLabel: d.shortLabel,
      dayNum: d.dayNum,
      long: c.long,
      short: c.short,
      live: c.live,
      total: trendBucketTotal(c),
    };
  });
}

function enumerateWeeksInRange(start, end) {
  const weeks = [];
  const startDay = startOfLocalDay(start);
  const endDay = startOfLocalDay(end);
  const spanDays = Math.floor((endDay - startDay) / 86400000) + 1;
  const numWeeks = Math.max(1, Math.ceil(spanDays / 7));
  for (let w = 0; w < numWeeks; w++) {
    const weekStart = new Date(startDay);
    weekStart.setDate(weekStart.getDate() + w * 7);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 6);
    if (weekEnd > endDay) weekEnd.setTime(endDay.getTime());
    weeks.push({
      key: "w" + w,
      weekIndex: w,
      weekStart: weekStart,
      weekEnd: weekEnd,
      label: weekStart.toLocaleDateString("en-IN", { timeZone: DISPLAY_TIMEZONE, month: "short", day: "numeric" })
        + " – " + weekEnd.toLocaleDateString("en-IN", { timeZone: DISPLAY_TIMEZONE, month: "short", day: "numeric" }),
      shortLabel: weekStart.toLocaleDateString("en-IN", { timeZone: DISPLAY_TIMEZONE, month: "short", day: "numeric" }),
    });
  }
  return weeks;
}

function weekBucketIndex(iso, rangeStartDay) {
  const t = startOfLocalDay(iso);
  const dayIndex = Math.floor((t - rangeStartDay) / 86400000);
  if (dayIndex < 0) return -1;
  return Math.floor(dayIndex / 7);
}

function computeWeeklyUploadTrend(classified, range) {
  const bounds = getRangeBounds(range);
  const filtered = filterByBounds(classified, bounds.start, bounds.end);
  const startDay = startOfLocalDay(bounds.start);
  const weeks = enumerateWeeksInRange(bounds.start, bounds.end);
  const counts = weeks.map(function () { return emptyTrendCounts(); });
  filtered.forEach(function (it) {
    if (!isPublishingCategory(it.category)) return;
    const wi = weekBucketIndex(it.publishedAt, startDay);
    if (wi < 0 || wi >= counts.length) return;
    counts[wi][it.category]++;
  });
  return weeks.map(function (w, i) {
    const c = counts[i];
    return {
      key: w.key,
      label: w.label,
      shortLabel: w.shortLabel,
      long: c.long,
      short: c.short,
      live: c.live,
      total: trendBucketTotal(c),
    };
  });
}

function computeUploadTrend(classified, range) {
  const days = rangeWindowDays(range);
  if (days <= 14) {
    return { granularity: "day", data: computeDailyUploadTrend(classified, range) };
  }
  if (days <= 91) {
    return { granularity: "week", data: computeWeeklyUploadTrend(classified, range) };
  }
  return { granularity: "month", data: computeMonthlyUploadTrend(classified, range) };
}

function computeMonthlyUploadTrend(classified, range) {
  const bounds = getRangeBounds(range);
  const filtered = filterByBounds(classified, bounds.start, bounds.end);
  const months = enumerateMonthsInRange(bounds.start, bounds.end);
  const counts = {};
  months.forEach(function (m) { counts[m.key] = emptyTrendCounts(); });
  filtered.forEach(function (it) {
    if (!isPublishingCategory(it.category)) return;
    const key = monthBucketKey(it.publishedAt);
    if (!counts[key]) return;
    counts[key][it.category]++;
  });
  return months.map(function (m) {
    const c = counts[m.key];
    return {
      key: m.key,
      label: m.label,
      shortLabel: m.shortLabel,
      long: c.long,
      short: c.short,
      live: c.live,
      total: trendBucketTotal(c),
    };
  });
}

function categoryChangePct(current, previous) {
  if (previous === 0) return null;
  return ((current - previous) / previous) * 100;
}

function formatCompactDelta(current, previous) {
  if (previous === 0 && current === 0) return null;
  if (previous === 0 && current > 0) return { text: "new", up: true, isNew: true };
  const pct = Math.round(((current - previous) / previous) * 100);
  if (pct === 0) return null;
  return { text: (pct > 0 ? "↑" : "↓") + Math.abs(pct) + "%", up: pct > 0, isNew: false };
}

function buildPublishingObservations(data) {
  const observations = [];
  const currentTotal = data.currentTotal;
  const previousTotal = data.previousTotal;
  const longPct = data.longPctChange;
  const shortPct = data.shortPctChange;
  const livePct = data.livePctChange;
  const overallPct = data.pctChange;
  const formatMix = data.formatMix;
  const previousFormatMix = data.previousFormatMix;
  const mostActiveDay = data.mostActiveDay;
  const trend = data.trend;

  if (currentTotal === 0) {
    return ["No uploads in this period."];
  }

  if (formatMix) {
    const focus = describeFormatFocus(formatMix);
    if (focus) observations.push(focus.observation);
  }

  if (previousTotal > 0 && formatMix && previousFormatMix) {
    const shifts = [];
    if (formatMix.pctLong - previousFormatMix.pctLong >= 12) shifts.push("more long-form");
    if (previousFormatMix.pctLong - formatMix.pctLong >= 12) shifts.push("less long-form");
    if (formatMix.pctShort - previousFormatMix.pctShort >= 12) shifts.push("more Shorts");
    if (previousFormatMix.pctShort - formatMix.pctShort >= 12) shifts.push("fewer Shorts");
    if (formatMix.pctLive - previousFormatMix.pctLive >= 12) shifts.push("more live streams");
    if (previousFormatMix.pctLive - formatMix.pctLive >= 12) shifts.push("fewer live streams");
    if (shifts.length) {
      observations.push("Compared to the previous period, the creator is publishing " + shifts.slice(0, 2).join(" and ") + ".");
    } else if (
      formatMix.primaryFormat &&
      previousFormatMix.primaryFormat &&
      formatMix.primaryFormat.dominant &&
      previousFormatMix.primaryFormat.dominant &&
      formatMix.primaryFormat.id !== previousFormatMix.primaryFormat.id
    ) {
      observations.push(
        "The main content focus shifted from " + previousFormatMix.primaryFormat.label.toLowerCase() +
        " to " + formatMix.primaryFormat.label.toLowerCase() + "."
      );
    }
  }

  if (livePct !== null && Math.abs(livePct) >= 20 && data.currentLive > 0) {
    observations.push(livePct < 0
      ? "Live stream publishing slowed down significantly this period."
      : "Live stream publishing picked up meaningfully this period.");
  } else if (shortPct !== null && Math.abs(shortPct) >= 20) {
    observations.push(shortPct < 0
      ? "Shorts publishing decreased significantly this period."
      : "Shorts publishing picked up meaningfully this period.");
  } else if (longPct !== null && Math.abs(longPct) >= 20) {
    observations.push(longPct < 0
      ? "Long-form publishing slowed down this period."
      : "Long-form publishing increased significantly this period.");
  }

  if (mostActiveDay && mostActiveDay.pct >= 20) {
    observations.push(mostActiveDay.day + " is the creator's most active publishing day.");
  }

  if (observations.length < 4 && trend && trend.length >= 4) {
    const midpoint = Math.ceil(trend.length / 2);
    const firstHalf = trend.slice(0, midpoint);
    const secondHalf = trend.slice(midpoint);
    function sumField(arr, field) {
      return arr.reduce(function (sum, d) { return sum + (d[field] || 0); }, 0);
    }
    const formatTrends = [
      { field: "long", label: "Long-form" },
      { field: "short", label: "Shorts" },
      { field: "live", label: "Live" },
    ];
    formatTrends.forEach(function (fmt) {
      const firstCount = sumField(firstHalf, fmt.field);
      const secondCount = sumField(secondHalf, fmt.field);
      if (secondCount > firstCount * 1.5 && secondCount >= 2) {
        observations.push(fmt.label + " uploads are trending up toward the end of this period.");
      } else if (firstCount > secondCount * 1.5 && firstCount >= 2) {
        observations.push(fmt.label + " uploads are tapering off toward the end of this period.");
      }
    });
  }

  if (observations.length < 3 && trend && trend.length >= 3) {
    const midpoint = Math.ceil(trend.length / 2);
    const firstHalf = trend.slice(0, midpoint).reduce(function (sum, d) { return sum + d.total; }, 0);
    const secondHalf = trend.slice(midpoint).reduce(function (sum, d) { return sum + d.total; }, 0);
    if (secondHalf > firstHalf * 1.3) {
      observations.push("Overall upload pace accelerated toward the end of this period.");
    } else if (firstHalf > secondHalf * 1.3) {
      observations.push("Overall upload pace slowed toward the end of this period.");
    }
  }

  if (observations.length < 4 && overallPct !== null && Math.abs(overallPct) >= 10) {
    observations.push("Overall publishing " + (overallPct > 0 ? "increased" : "decreased")
      + " " + Math.abs(Math.round(overallPct)) + "% vs the previous period.");
  }

  if (observations.length === 0) {
    observations.push("Publishing stayed consistent across content formats this period.");
  }

  return observations.slice(0, 4);
}

function formatPublishingPaceLine(longCount, shortCount, liveCount, range) {
  const days = rangeWindowDays(range);
  const weeks = days / 7;
  const months = days / 30.44;

  function formatCount(count, singular, plural, zeroLabel) {
    const perWeek = Math.round(count / weeks);
    const perMonth = Math.round(count / months);
    if (perWeek >= 1) {
      return perWeek + " " + (perWeek === 1 ? singular : plural) + "/week";
    }
    if (count > 0) {
      return perMonth + " " + (perMonth === 1 ? singular : plural) + "/month";
    }
    return zeroLabel;
  }

  const visible = [];
  if (longCount > 0 || (longCount === 0 && shortCount === 0 && liveCount === 0)) {
    visible.push(formatCount(longCount, "long-form video", "long-form videos", "0 long-form videos/week"));
  }
  if (shortCount > 0 || (longCount === 0 && shortCount === 0 && liveCount === 0)) {
    visible.push(formatCount(shortCount, "Short", "Shorts", "0 Shorts/week"));
  }
  if (liveCount > 0) {
    visible.push(formatCount(liveCount, "live stream", "live streams", "0 live streams/week"));
  }

  return visible.join(" · ");
}

function buildPublishingStrategySummary(formatMix, previousFormatMix) {
  if (!formatMix) return null;
  const focus = describeFormatFocus(formatMix);
  if (!focus) return null;
  let summary = focus.strategy;
  if (
    previousFormatMix &&
    previousFormatMix.primaryFormat &&
    formatMix.primaryFormat &&
    formatMix.primaryFormat.dominant &&
    previousFormatMix.primaryFormat.dominant &&
    previousFormatMix.primaryFormat.id !== formatMix.primaryFormat.id
  ) {
    summary += ". Shifted from " + previousFormatMix.primaryFormat.label.toLowerCase() + " last period";
  }
  return summary;
}

function computePublishingInsights(classified, range) {
  const bounds = getRangeBounds(range);
  const prevBounds = getPreviousRangeBounds(range);
  const currentItems = filterByBounds(classified, bounds.start, bounds.end);
  const previousItems = filterByBounds(classified, prevBounds.start, prevBounds.end);
  const activity = computePublishingActivity(classified, range);

  function countType(items, type) {
    return items.filter(function (it) { return it.category === type; }).length;
  }

  const currentLong = countType(currentItems, "long");
  const currentShort = countType(currentItems, "short");
  const currentLive = countType(currentItems, "live");
  const previousLong = countType(previousItems, "long");
  const previousShort = countType(previousItems, "short");
  const previousLive = countType(previousItems, "live");
  const currentTotal = currentLong + currentShort + currentLive;
  const previousTotal = previousLong + previousShort + previousLive;
  let pctChange = null;
  if (previousTotal > 0) {
    pctChange = ((currentTotal - previousTotal) / previousTotal) * 100;
  }

  const trendResult = computeUploadTrend(classified, range);
  const formatMix = activity.formatMix;
  const previousFormatMix = formatMixSplit({ long: previousLong, short: previousShort, live: previousLive });
  const strategySummary = buildPublishingStrategySummary(formatMix, previousFormatMix);

  return {
    currentTotal: currentTotal,
    previousTotal: previousTotal,
    currentLong: currentLong,
    currentShort: currentShort,
    currentLive: currentLive,
    previousLong: previousLong,
    previousShort: previousShort,
    previousLive: previousLive,
    pctChange: pctChange,
    longPctChange: categoryChangePct(currentLong, previousLong),
    shortPctChange: categoryChangePct(currentShort, previousShort),
    livePctChange: categoryChangePct(currentLive, previousLive),
    previousPeriodLabel: formatDate(prevBounds.start.toISOString()) + " – " + formatDate(prevBounds.end.toISOString()),
    periodLabel: formatDate(bounds.start.toISOString()) + " – " + formatDate(bounds.end.toISOString()),
    publishingPace: formatPublishingPaceLine(currentLong, currentShort, currentLive, range),
    trend: trendResult.data,
    trendGranularity: trendResult.granularity,
    formatMix: formatMix,
    previousFormatMix: previousFormatMix,
    strategySummary: strategySummary,
    mostActiveDay: activity.mostActiveDay,
    observations: buildPublishingObservations({
      currentTotal: currentTotal,
      previousTotal: previousTotal,
      currentLong: currentLong,
      previousLong: previousLong,
      currentShort: currentShort,
      previousShort: previousShort,
      currentLive: currentLive,
      previousLive: previousLive,
      longPctChange: categoryChangePct(currentLong, previousLong),
      shortPctChange: categoryChangePct(currentShort, previousShort),
      livePctChange: categoryChangePct(currentLive, previousLive),
      pctChange: pctChange,
      formatMix: formatMix,
      previousFormatMix: previousFormatMix,
      mostActiveDay: activity.mostActiveDay,
      trend: trendResult.data,
    }),
  };
}

function computeContentMix(items) {
  const counts = { live: 0, short: 0, long: 0 };
  items.forEach(function (it) { counts[it.category]++; });
  const total = items.length || 1;
  return {
    live: counts.live, short: counts.short, long: counts.long,
    pctLive: Math.round(100 * counts.live / total),
    pctShort: Math.round(100 * counts.short / total),
    pctLong: Math.round(100 * counts.long / total),
  };
}

const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

function computeMostActiveDay(items) {
  if (!items.length) return null;
  const counts = new Array(7).fill(0);
  items.forEach(function (it) {
    counts[new Date(it.publishedAt).getDay()]++;
  });
  let topDay = 0;
  for (let d = 1; d < 7; d++) if (counts[d] > counts[topDay]) topDay = d;
  const total = items.length || 1;
  return {
    day: DAY_NAMES[topDay],
    count: counts[topDay],
    pct: Math.round(100 * counts[topDay] / total),
  };
}

function computeAverageGap(items) {
  if (items.length < 2) return null;
  const sorted = items.slice().sort(function (a, b) { return new Date(a.publishedAt) - new Date(b.publishedAt); });
  const gaps = [];
  for (let i = 1; i < sorted.length; i++) {
    gaps.push((new Date(sorted[i].publishedAt) - new Date(sorted[i - 1].publishedAt)) / 86400000);
  }
  const mean = gaps.reduce(function (a, b) { return a + b; }, 0) / gaps.length;
  return { meanGapDays: mean };
}

const FORMAT_FOCUS_DOMINANT_PCT = 65;
const FORMAT_FOCUS_MIN_GAP_PCT = 15;

function getTopFormats(mix, total) {
  total = total || ((mix.long || 0) + (mix.short || 0) + (mix.live || 0));
  if (!total) return [];
  return [
    { id: "long", label: "Long-form", shortLabel: "long-form", count: mix.long || 0, pct: Math.round(100 * (mix.long || 0) / total) },
    { id: "short", label: "Shorts", shortLabel: "Shorts", count: mix.short || 0, pct: Math.round(100 * (mix.short || 0) / total) },
    { id: "live", label: "Live streams", shortLabel: "live streams", count: mix.live || 0, pct: Math.round(100 * (mix.live || 0) / total) },
  ].filter(function (f) { return f.count > 0; }).sort(function (a, b) { return b.count - a.count; });
}

function getPrimaryFormat(mix, total) {
  const formats = getTopFormats(mix, total);
  if (!formats.length) return null;
  const top = formats[0];
  const second = formats[1];
  const gap = second ? top.pct - second.pct : top.pct;
  const dominant = top.pct >= FORMAT_FOCUS_DOMINANT_PCT && gap >= FORMAT_FOCUS_MIN_GAP_PCT;
  const balanced = !dominant && formats.length >= 2 && gap < FORMAT_FOCUS_MIN_GAP_PCT;
  return {
    id: top.id,
    label: top.label,
    count: top.count,
    pct: top.pct,
    dominant: dominant,
    balanced: balanced,
    gapPct: gap,
    topFormats: formats,
  };
}

function describeFormatFocus(formatMix) {
  if (!formatMix || !formatMix.primaryFormat) return null;
  const primary = formatMix.primaryFormat;
  const mixLine = [
    formatMix.pctLong > 0 ? formatMix.pctLong + "% long-form" : null,
    formatMix.pctShort > 0 ? formatMix.pctShort + "% Shorts" : null,
    formatMix.pctLive > 0 ? formatMix.pctLive + "% live" : null,
  ].filter(Boolean).join(" · ");

  if (primary.dominant) {
    return {
      observation: primary.label + " is this creator's main focus (" + primary.pct + "% of uploads).",
      strategy: "Primarily publishes " + primary.label.toLowerCase() + " (" + primary.pct + "% of uploads)",
    };
  }

  const active = (primary.topFormats || []).filter(function (f) { return f.pct >= 10; });
  if (primary.balanced && active.length >= 2) {
    if (active.length === 2) {
      return {
        observation: "This creator balances both " + active[0].shortLabel + " and " + active[1].shortLabel + " (" + mixLine + ").",
        strategy: "Balances both " + active[0].shortLabel + " and " + active[1].shortLabel + " (" + mixLine + ")",
      };
    }
    return {
      observation: "This creator spreads uploads across multiple formats (" + mixLine + ").",
      strategy: "Mixed strategy across formats (" + mixLine + ")",
    };
  }

  return {
    observation: "This creator leans toward " + primary.label.toLowerCase() + ", but the split is still fairly close (" + mixLine + ").",
    strategy: "Leans toward " + primary.label.toLowerCase() + " (" + mixLine + ")",
  };
}

function formatMixSplit(mix) {
  const total = (mix.long || 0) + (mix.short || 0) + (mix.live || 0);
  if (!total) return null;
  return {
    long: mix.long || 0,
    short: mix.short || 0,
    live: mix.live || 0,
    pctLong: Math.round(100 * (mix.long || 0) / total),
    pctShort: Math.round(100 * (mix.short || 0) / total),
    pctLive: Math.round(100 * (mix.live || 0) / total),
    primaryFormat: getPrimaryFormat(mix, total),
  };
}

function medianValue(values) {
  if (!values.length) return 0;
  const sorted = values.slice().sort(function (a, b) { return a - b; });
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

function percentileValue(values, p) {
  if (!values.length) return 0;
  const sorted = values.slice().sort(function (a, b) { return a - b; });
  const idx = (sorted.length - 1) * p;
  const lo = Math.floor(idx);
  const hi = Math.ceil(idx);
  if (lo === hi) return sorted[lo];
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
}

function performanceVideos(classified) {
  return classified.filter(function (it) {
    return it.category === "long" || it.category === "short" || it.category === "live";
  });
}

function formatCategoryBadgeClass(category) {
  if (category === "short") return "bg-sky-50 text-sky-700";
  if (category === "live") return "bg-rose-50 text-rose-700";
  return "bg-slate-100 text-slate-600";
}

function formatCategoryLabel(category) {
  if (category === "short") return "Short";
  if (category === "live") return "Live";
  return "Long-form";
}

function videoViewsPerDay(video, asOf) {
  const published = new Date(video.publishedAt);
  const end = asOf || new Date();
  const days = Math.max(1, (end - published) / 86400000);
  return video.viewCount / days;
}

function videoEngagementRate(video) {
  if (!video.viewCount) return 0;
  return ((video.likeCount + video.commentCount) / video.viewCount) * 100;
}

function enrichPerformanceVideo(video, asOf) {
  return {
    id: video.id,
    title: video.title,
    publishedAt: video.publishedAt,
    category: video.category,
    viewCount: video.viewCount,
    likeCount: video.likeCount,
    commentCount: video.commentCount,
    viewsPerDay: videoViewsPerDay(video, asOf),
    engagementRate: videoEngagementRate(video),
  };
}

function computePeriodPerformanceStats(items, asOf) {
  if (!items.length) return null;
  const enriched = items.map(function (it) { return enrichPerformanceVideo(it, asOf); });
  const views = enriched.map(function (it) { return it.viewCount; });
  const viewsPerDay = enriched.map(function (it) { return it.viewsPerDay; });
  const engagements = enriched.map(function (it) { return it.engagementRate; });
  const sum = function (arr) { return arr.reduce(function (a, b) { return a + b; }, 0); };
  return {
    count: items.length,
    avgViews: sum(views) / views.length,
    medianViews: medianValue(views),
    avgViewsPerDay: sum(viewsPerDay) / viewsPerDay.length,
    avgEngagement: sum(engagements) / engagements.length,
    enriched: enriched,
  };
}

function computeMonthlyAvgViewsTrend(items, range) {
  const bounds = getRangeBounds(range);
  const months = enumerateMonthsInRange(bounds.start, bounds.end);
  const buckets = {};
  months.forEach(function (m) { buckets[m.key] = []; });
  items.forEach(function (it) {
    const key = monthBucketKey(it.publishedAt);
    if (buckets[key]) buckets[key].push(it.viewCount);
  });
  return months.map(function (m) {
    const views = buckets[m.key];
    const sum = views.reduce(function (a, b) { return a + b; }, 0);
    return {
      key: m.key,
      label: m.label,
      shortLabel: m.shortLabel,
      avgViews: views.length ? sum / views.length : 0,
      count: views.length,
    };
  });
}

const BREAKOUT_RATIO_THRESHOLD = 2;

function isBreakoutVideo(viewCount, typicalMedian) {
  return typicalMedian > 0 && viewCount >= typicalMedian * BREAKOUT_RATIO_THRESHOLD;
}

function formatBreakoutMultiplier(n) {
  if (!n || isNaN(n)) return "—";
  const rounded = n >= 10 ? Math.round(n) : parseFloat(n.toFixed(1));
  return rounded + "×";
}

function sortVideosByMetric(videos, metric) {
  const copy = videos.slice();
  if (metric === "viewsPerDay") {
    copy.sort(function (a, b) { return b.viewsPerDay - a.viewsPerDay; });
  } else if (metric === "engagement") {
    copy.sort(function (a, b) { return b.engagementRate - a.engagementRate; });
  } else {
    copy.sort(function (a, b) { return b.viewCount - a.viewCount; });
  }
  return copy;
}

function enrichVideosWithBreakout(enriched, typicalMedian, formatBaselines) {
  return enriched.map(function (video) {
    const baseline = typicalMedianForVideo(video, typicalMedian, formatBaselines);
    const breakout = isBreakoutVideo(video.viewCount, baseline);
    return Object.assign({}, video, {
      isBreakout: breakout,
      breakoutRatio: baseline > 0 ? video.viewCount / baseline : 0,
      typicalViews: baseline,
    });
  });
}

function buildContentPerformanceInsight(data) {
  const recent = data.recentPerformance || {};
  const hasPct = recent.pctChange !== null && recent.pctChange !== undefined && !isNaN(recent.pctChange);
  const formatLabel = data.formatLabel || "";
  const breakoutCount = data.breakoutCount || 0;
  const strongest = data.strongestVideo;
  const breakoutTotalViews = data.breakoutTotalViews || 0;
  const performanceLabel = formatLabel ? formatLabel + " performance" : "Performance";

  let lead = "";
  if (hasPct) {
    const magnitude = Math.abs(Math.round(recent.pctChange));
    if (magnitude < 5) {
      lead = performanceLabel + " held steady";
    } else if (recent.pctChange > 0) {
      lead = performanceLabel + " improved " + magnitude + "%";
    } else {
      lead = performanceLabel + " declined " + magnitude + "%";
    }
  } else if (!recent.previousAvgViews && recent.avgViews > 0) {
    lead = (formatLabel || "This format") + " has new uploads with no comparable previous period";
  } else if (data.hasData) {
    lead = performanceLabel + " stayed within the typical range";
  }

  const tailParts = [];
  if (breakoutCount > 0) {
    let breakoutPart = breakoutCount + " breakout video" + (breakoutCount === 1 ? "" : "s");
    if (breakoutTotalViews > 0) {
      breakoutPart += " generated " + formatNumber(breakoutTotalViews) + " views";
    }
    tailParts.push(breakoutPart);
  }

  if (strongest && strongest.title) {
    if (breakoutCount > 0) {
      if (strongest.isBreakout && strongest.breakoutRatio > 0) {
        tailParts.push(
          "led by \"" + strongest.title + "\" at " + formatBreakoutMultiplier(strongest.breakoutRatio) + " typical performance"
        );
      } else {
        tailParts.push(
          "led by \"" + strongest.title + "\" with " + formatNumber(strongest.viewCount) + " views"
        );
      }
    } else {
      tailParts.push(
        "\"" + strongest.title + "\" led with " + formatNumber(strongest.viewCount) + " views"
      );
    }
  }

  if (!lead && !tailParts.length) return null;

  if (tailParts.length) {
    if (!lead) return tailParts.join(", ") + ".";
    const useBut = lead.match(/held steady|declined|improved|within the typical range|no comparable/);
    return lead + (useBut ? ", but " : ": ") + tailParts.join(", ") + ".";
  }

  return lead + ".";
}

function typicalMedianForVideo(video, typicalMedian, formatBaselines) {
  if (formatBaselines && video.category) {
    const baseline = formatBaselines[video.category];
    if (baseline > 0) return baseline;
  }
  return typicalMedian;
}

function computeFormatPerformanceSlice(currentItems, previousItems, range, asOf, options) {
  options = options || {};
  const formatBaselines = options.formatBaselines || null;
  const formatLabel = options.formatLabel || "";
  const current = computePeriodPerformanceStats(currentItems, asOf);
  const previous = computePeriodPerformanceStats(previousItems, asOf);

  if (!currentItems.length) {
    return {
      hasData: false,
      videoCount: 0,
      avgViews: null,
      medianViews: null,
      avgViewsPerDay: null,
      avgEngagement: null,
      topVideos: [],
      videos: [],
      breakoutCount: 0,
      avgBreakoutMultiplier: 0,
      breakoutTotalViews: 0,
      typicalRange: { low: 0, high: 0, median: 0 },
      performanceTrend: computeMonthlyAvgViewsTrend([], range),
      recentPerformance: {
        avgViews: null,
        medianViews: null,
        previousAvgViews: previous ? previous.avgViews : null,
        previousMedianViews: previous ? previous.medianViews : null,
        pctChange: null,
      },
      keyInsight: null,
    };
  }

  const periodViews = currentItems.map(function (it) { return it.viewCount; });
  const typicalMedian = medianValue(periodViews);
  const typicalLow = percentileValue(periodViews, 0.25);
  const typicalHigh = percentileValue(periodViews, 0.75);

  const videos = enrichVideosWithBreakout(current.enriched, typicalMedian, formatBaselines);
  const breakoutVideos = videos.filter(function (it) { return it.isBreakout; });
  const breakoutCount = breakoutVideos.length;
  const avgBreakoutMultiplier = breakoutCount
    ? breakoutVideos.reduce(function (sum, it) { return sum + it.breakoutRatio; }, 0) / breakoutCount
    : 0;
  const breakoutTotalViews = breakoutVideos.reduce(function (sum, it) { return sum + it.viewCount; }, 0);
  const strongestVideo = sortVideosByMetric(videos, "views")[0] || null;

  let avgViewsPctChange = null;
  if (current && previous && previous.avgViews > 0) {
    avgViewsPctChange = ((current.avgViews - previous.avgViews) / previous.avgViews) * 100;
  }

  const performanceTrend = computeMonthlyAvgViewsTrend(currentItems, range);
  const keyInsight = buildContentPerformanceInsight({
    hasData: true,
    formatLabel: formatLabel,
    breakoutCount: breakoutCount,
    avgBreakoutMultiplier: avgBreakoutMultiplier,
    breakoutTotalViews: breakoutTotalViews,
    strongestVideo: strongestVideo,
    recentPerformance: {
      avgViews: current.avgViews,
      previousAvgViews: previous ? previous.avgViews : null,
      pctChange: avgViewsPctChange,
    },
  });

  return {
    hasData: true,
    videoCount: current.count,
    avgViews: current.avgViews,
    medianViews: current.medianViews,
    avgViewsPerDay: current.avgViewsPerDay,
    avgEngagement: current.avgEngagement,
    videos: videos,
    topVideos: sortVideosByMetric(videos, "views").slice(0, 5),
    breakoutCount: breakoutCount,
    avgBreakoutMultiplier: avgBreakoutMultiplier,
    breakoutTotalViews: breakoutTotalViews,
    typicalRange: {
      low: typicalLow,
      high: typicalHigh,
      median: typicalMedian,
    },
    performanceTrend: performanceTrend,
    recentPerformance: {
      avgViews: current.avgViews,
      medianViews: current.medianViews,
      previousAvgViews: previous ? previous.avgViews : null,
      previousMedianViews: previous ? previous.medianViews : null,
      pctChange: avgViewsPctChange,
    },
    keyInsight: keyInsight,
  };
}

function buildFormatComparisonRow(label, perf) {
  return {
    label: label,
    hasData: perf.hasData,
    videoCount: perf.videoCount,
    avgViews: perf.avgViews,
    medianViews: perf.medianViews,
    avgViewsPerDay: perf.avgViewsPerDay,
    avgEngagement: perf.avgEngagement,
    typicalMedian: perf.typicalRange ? perf.typicalRange.median : null,
  };
}

function computeContentPerformance(classified, range) {
  const bounds = getRangeBounds(range);
  const prevBounds = getPreviousRangeBounds(range);
  const asOf = bounds.end;
  const videos = performanceVideos(classified);
  const currentAll = filterByBounds(videos, bounds.start, bounds.end);
  const previousAll = filterByBounds(videos, prevBounds.start, prevBounds.end);

  const longCurrent = currentAll.filter(function (it) { return it.category === "long"; });
  const shortCurrent = currentAll.filter(function (it) { return it.category === "short"; });
  const liveCurrent = currentAll.filter(function (it) { return it.category === "live"; });
  const longPrevious = previousAll.filter(function (it) { return it.category === "long"; });
  const shortPrevious = previousAll.filter(function (it) { return it.category === "short"; });
  const livePrevious = previousAll.filter(function (it) { return it.category === "live"; });

  const longPerf = computeFormatPerformanceSlice(longCurrent, longPrevious, range, asOf, {
    formatLabel: "Long-form",
  });
  const shortPerf = computeFormatPerformanceSlice(shortCurrent, shortPrevious, range, asOf, {
    formatLabel: "Shorts",
  });
  const livePerf = computeFormatPerformanceSlice(liveCurrent, livePrevious, range, asOf, {
    formatLabel: "Live",
  });

  const formatBaselines = {
    long: longPerf.typicalRange.median,
    short: shortPerf.typicalRange.median,
    live: livePerf.typicalRange.median,
  };

  const allPerf = computeFormatPerformanceSlice(currentAll, previousAll, range, asOf, {
    formatLabel: "",
    formatBaselines: formatBaselines,
  });

  const hasAnyData = currentAll.length > 0;

  return {
    periodLabel: formatDate(bounds.start.toISOString()) + " – " + formatDate(bounds.end.toISOString()),
    previousPeriodLabel: formatDate(prevBounds.start.toISOString()) + " – " + formatDate(prevBounds.end.toISOString()),
    hasData: hasAnyData,
    formats: {
      all: allPerf,
      long: longPerf,
      short: shortPerf,
      live: livePerf,
    },
    formatComparison: {
      long: buildFormatComparisonRow("Long-form", longPerf),
      short: buildFormatComparisonRow("Shorts", shortPerf),
      live: buildFormatComparisonRow("Live", livePerf),
    },
  };
}

// ---------- content topics ----------

const TOPIC_MIN_VIDEOS = 2;
const TOPIC_MAX_MAIN = 8;
const TOPIC_HIGH_RATIO = 1.2;
const TOPIC_LOW_RATIO = 0.8;

function topicSlug(name) {
  return (name || "topic").toLowerCase().replace(/[^a-z0-9]+/g, "-");
}

function normalizePrimaryTopic(name) {
  return (name || "").trim().replace(/\s+/g, " ");
}

function isValidTopicClassification(c) {
  return !!(c && c.version === TOPIC_CLASSIFICATION_VERSION && c.primaryTopic && typeof c.confidence === "number");
}

function normalizeTopicClassification(raw) {
  if (!raw || !raw.primaryTopic) return null;
  const primary = normalizePrimaryTopic(raw.primaryTopic);
  return {
    version: TOPIC_CLASSIFICATION_VERSION,
    primaryTopic: primary.toLowerCase() === "other" ? "Other" : primary,
    subtopic: raw.subtopic ? normalizePrimaryTopic(raw.subtopic) : null,
    entities: Array.isArray(raw.entities) ? raw.entities.map(function (e) { return String(e).trim(); }).filter(Boolean).slice(0, 12) : [],
    contentType: raw.contentType || "other",
    confidence: Math.min(1, Math.max(0, Number(raw.confidence) || 0.5)),
    classifiedAt: raw.classifiedAt || new Date().toISOString(),
  };
}

function buildGeminiClassificationPrompt(videos, existingTopics) {
  const topicList = existingTopics.length ? existingTopics.join(", ") : "none yet";
  const payload = videos.map(function (v) {
    return {
      videoId: v.id,
      title: v.title,
      description: (v.description || "").slice(0, 600),
      tags: (v.tags || []).slice(0, 20),
      transcript: (v.transcript || "").slice(0, 1000) || null,
    };
  });
  return [
    "You classify YouTube videos into meaningful content topics for channel analytics.",
    "",
    "Rules:",
    "- Return ONE broad primaryTopic per video (e.g. AI Tools, Coding, Productivity, Gaming).",
    "- Do NOT use person names, creator names, guests, or celebrities as primaryTopic.",
    "- Do NOT use generic clickbait fragments or random title words as topics.",
    "- Reuse existing topics when they fit: " + topicList,
    "- Use identical primaryTopic strings for related videos. Avoid duplicate near-synonyms.",
    "- Keep distinct topics to a small set (about 4-10). Minimize use of Other.",
    "- Put people/brands in entities, not primaryTopic.",
    "- subtopic: optional narrower theme. contentType: tutorial|review|vlog|news|entertainment|challenge|explainer|reaction|podcast|documentary|listicle|other",
    "- confidence: 0.0 to 1.0",
    "",
    "Return ONLY a JSON array:",
    '[{"videoId":"id","primaryTopic":"Topic","subtopic":null,"entities":["Name"],"contentType":"tutorial","confidence":0.9}]',
    "",
    "Videos:",
    JSON.stringify(payload),
  ].join("\n");
}

function sleepMs(ms) {
  return new Promise(function (resolve) { setTimeout(resolve, ms); });
}

function formatGeminiUserError(status, errText) {
  if (status === 429) {
    return "Gemini quota reached for now. Classified videos are saved — wait a bit and refresh to continue.";
  }
  if (status === 503) {
    return "Gemini is temporarily overloaded. Try again in a minute.";
  }
  return "Gemini API error (" + status + "): " + (errText || "").slice(0, 180);
}

async function callGeminiJson(prompt) {
  const geminiKey = requireGeminiApiKey();
  let lastError = null;
  let lastStatus = null;

  for (let attempt = 0; attempt < GEMINI_RETRY_DELAYS_MS.length + 1; attempt++) {
    for (let m = 0; m < GEMINI_MODEL_CANDIDATES.length; m++) {
      const model = GEMINI_MODEL_CANDIDATES[m];
      const url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + encodeURIComponent(geminiKey);
      let res;
      try {
        res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              temperature: 0.15,
              responseMimeType: "application/json",
            },
          }),
        });
      } catch (networkErr) {
        lastError = networkErr && networkErr.message ? networkErr.message : "Network error calling Gemini.";
        lastStatus = 0;
        continue;
      }

      if (res.ok) {
        const data = await res.json();
        const text = data.candidates && data.candidates[0] && data.candidates[0].content &&
          data.candidates[0].content.parts && data.candidates[0].content.parts[0] &&
          data.candidates[0].content.parts[0].text;
        if (!text) throw new Error("Gemini returned an empty response.");
        const cleaned = text.replace(/```json\s*/gi, "").replace(/```/g, "").trim();
        const parsed = JSON.parse(cleaned);
        if (!Array.isArray(parsed)) throw new Error("Gemini response was not a JSON array.");
        return { results: parsed, model: model };
      }

      const errText = await res.text();
      lastStatus = res.status;
      lastError = formatGeminiUserError(res.status, errText);

      // Retired/missing model → try next model immediately
      if (res.status === 404) continue;
      // Quota/overload → try next model, then backoff and retry
      if (res.status === 429 || res.status === 503) continue;
      // Other errors (auth, etc.) stop immediately
      const err = new Error(lastError);
      err.status = res.status;
      throw err;
    }

    if (attempt < GEMINI_RETRY_DELAYS_MS.length && (lastStatus === 429 || lastStatus === 503 || lastStatus === 0)) {
      await sleepMs(GEMINI_RETRY_DELAYS_MS[attempt]);
      continue;
    }
    break;
  }

  const err = new Error(lastError || "Gemini API request failed.");
  err.status = lastStatus;
  throw err;
}

async function classifyVideosWithGemini(channelId, videos, options) {
  const opts = options || {};
  if (opts.canUseGemini === false) {
    const err = new Error("AI topic analysis is currently turned off for users. Please contact an admin.");
    err.code = "GEMINI_DISABLED";
    throw err;
  }
  const priorityIds = opts.priorityIds || {};
  const onProgress = opts.onProgress;
  const periodOnly = opts.periodOnly !== false;

  let loadedFromCache = 0;
  if (API_BASE && getStoredAuthToken() && channelId) {
    try {
      const serverMap = await fetchTopicClassificationsFromApi(channelId);
      loadedFromCache = await applyTopicClassificationsToVideos(channelId, videos, serverMap);
    } catch (e) {
